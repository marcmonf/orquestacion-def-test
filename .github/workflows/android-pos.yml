# Compila el APK de DEBUG de la app Android "Monetiser POS" (apps/android-pos)
# en cada push que toque la app (o este fichero) y lo deja como artefacto
# descargable en la pestaña Actions de GitHub. Sin secretos: el APK de debug se
# firma con la clave de depuración que genera Android en cada ejecución.
name: Android POS (APK debug)

on:
  push:
    paths:
      - 'apps/android-pos/**'
      - '.github/workflows/android-pos.yml'
  pull_request:
    paths:
      - 'apps/android-pos/**'
      - '.github/workflows/android-pos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android-pos
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de debug
        run: gradle --no-daemon assembleDebug

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: monetiser-pos-debug-apk
          path: apps/android-pos/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
