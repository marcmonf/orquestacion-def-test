openapi: 3.1.0
info:
  title: Monetiser Orchestrator API
  version: 0.4.1
servers:
  - url: https://orquestacion-def-test.onrender.com

paths:
  /initialize:
    post:
      summary: Inicializa un pago y devuelve paymentId y enlaces del iFrame
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: Clave idempotente para obtener la misma respuesta ante repeticiones
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantId, amount, currency, returnUrl, callbackUrl, method]
              properties:
                merchantId: { type: string }
                amount: { type: number }
                currency: { type: string }
                method: { type: string }
                returnUrl: { type: string, format: uri }
                callbackUrl: { type: string, format: uri }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  paymentId: { type: string }
                  merchantId: { type: string }
                  amount: { type: number }
                  currency: { type: string }
                  signature: { type: string }
                  timestamp: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
                  iframeUrl: { type: string, format: uri }
        '409':
          description: Conflicto de Idempotency-Key

  /iframe:
    get:
      summary: Carga HPP/iFrame seguro firmado desde backend
      parameters:
        - in: query
          name: paymentId
          required: true
          schema: { type: string }
        - in: query
          name: exp
          required: true
          schema: { type: string, format: date-time }
        - in: query
          name: signature
          required: true
          schema: { type: string }
        - in: query
          name: merchantId
          required: false
          schema: { type: string }
      responses:
        '200': { description: HTML iFrame }
        '403': { description: Firma inválida }
        '409': { description: Reuso o estado no inicializado }
        '410': { description: Enlace expirado }

  /orchestration/decide:
    post:
      summary: Evalúa reglas y sugiere conector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantId, amount, currency, method]
              properties:
                paymentId: { type: string }
                merchantId: { type: string }
                amount: { type: number }
                currency: { type: string }
                method: { type: string, enum: ["card","apm"] }
                cardNumber: { type: string }
                cardInfo:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Decisión calculada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  paymentId: { type: string, nullable: true }
                  decision:
                    type: object
                    properties:
                      connector: { type: string }
                      matchedRuleId: { type: string, nullable: true }
                      reasons: { type: array, items: { type: string } }
                      explain: { type: array, items: { type: object } }
                  cardInfo:
                    type: object
                    nullable: true
                  timestamp: { type: string, format: date-time }

  /rules/{merchantId}:
    get:
      summary: Obtiene la política actual del merchant
      parameters:
        - in: path
          name: merchantId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Política actual }
    put:
      summary: Crea/actualiza la política del merchant
      parameters:
        - in: path
          name: merchantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '200': { description: OK }

  /rules/validate:
    post:
      summary: Valida una política sin guardarla
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '200':
          description: Válida
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  normalized:
                    $ref: '#/components/schemas/Policy'

  /rules/try:
    post:
      summary: Prueba una política con un input y devuelve explicación legible
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                policy: { $ref: '#/components/schemas/Policy' }
                sample:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Resultado de prueba
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  decision:
                    type: object
                    properties:
                      connector: { type: string }
                      matchedRuleId: { type: string, nullable: true }
                      reasons: { type: array, items: { type: string } }
                      explain: { type: array, items: { type: object } }
                  explainHuman: { type: array, items: { type: string } }

  /rules/{merchantId}/audit:
    get:
      summary: Devuelve el histórico de cambios
      parameters:
        - in: path
          name: merchantId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200': { description: OK }

components:
  schemas:
    Policy:
      type: object
      required: [merchantId, version, defaultConnector, rules]
      properties:
        merchantId: { type: string }
        version: { type: string, enum: ["v1"] }
        defaultConnector: { type: string }
        rules:
          type: array
          items:
            type: object
            required: [id, when, action]
            properties:
              id: { type: string }
              priority: { type: integer }
              when:
                type: object
                additionalProperties: true
              action:
                type: object
                properties:
                  route: { type: string }

x-webhooks:
  payment.updated:
    post:
      summary: Webhook de actualización de pago
      headers:
        Monetiser-Signature:
          required: true
          description: Firma HMAC "t=<ts>, v1=<hexdigest>" con cuerpo JSON
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, version, data]
              properties:
                event: { type: string, enum: ["payment.updated"] }
                version: { type: string, enum: ["v1"] }
                data:
                  type: object
                  required: [paymentId, merchantId, status, amount, currency, timestamp]
                  properties:
                    paymentId: { type: string }
                    merchantId: { type: string }
                    status: { type: string }
                    amount: { type: number }
                    currency: { type: string }
                    connectorUsed: { type: string, nullable: true }
                    reasonCode: { type: string, nullable: true }
                    timestamp: { type: string, format: date-time }
                    cardInfo:
                      type: object
                      nullable: true
                      properties:
                        bin: { type: string, nullable: true }
                        cardBrand: { type: string, nullable: true }
                        cardType: { type: string, nullable: true }
                        issuerCountry: { type: string, nullable: true }
