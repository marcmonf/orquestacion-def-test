openapi: 3.1.0
info:
  title: Monetiser Orchestrator API
  version: 0.2.0
servers:
  - url: https://api.monetiser.example
paths:
  /initialize:
    post:
      summary: Inicializa un pago y devuelve paymentId, signature y iframeUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantId, amount, currency, returnUrl, callbackUrl, method]
              properties:
                merchantId: { type: string }
                amount: { type: number }
                currency: { type: string }
                method: { type: string }
                returnUrl: { type: string, format: uri }
                callbackUrl: { type: string, format: uri }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  paymentId: { type: string }
                  merchantId: { type: string }
                  amount: { type: number }
                  currency: { type: string }
                  signature: { type: string }
                  timestamp: { type: string }
                  expiresAt: { type: string }
                  iframeUrl: { type: string, format: uri }
                  iframeParams:
                    type: object
                    properties:
                      nonce: { type: string }
                      exp: { type: integer, description: "epoch ms" }
                      signature: { type: string }
                      iframeUrl: { type: string, format: uri }
  /iframe:
    get:
      summary: Carga HPP/iFrame seguro
      parameters:
        - in: query
          name: merchantId
          schema: { type: string }
          required: false
        - in: query
          name: paymentId
          schema: { type: string }
          required: true
        - in: query
          name: amount
          schema: { type: number }
          required: false
        - in: query
          name: currency
          schema: { type: string }
          required: false
        - in: query
          name: nonce
          schema: { type: string }
          required: false
        - in: query
          name: exp
          schema: { oneOf: [{ type: integer }, { type: string }] }
          required: true
        - in: query
          name: signature
          schema: { type: string }
          required: true
      responses:
        '200': { description: HTML iFrame }
        '403': { description: Firma inválida }
        '409': { description: Reuso/nonce inválido }
        '410': { description: Expirada }
  /orchestration/decide:
    post:
      summary: Evalúa reglas del merchant y sugiere conector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantId, amount, currency, method]
              properties:
                paymentId: { type: string }
                merchantId: { type: string }
                amount: { type: number }
                currency: { type: string }
                method: { type: string, enum: ["card","apm"] }
                cardNumber: { type: string }
                cardInfo:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Decisión calculada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  paymentId: { type: string, nullable: true }
                  decision:
                    type: object
                    properties:
                      connector: { type: string }
                      matchedRuleId: { type: string, nullable: true }
                      reasons: { type: array, items: { type: string } }
                      explain: { type: array, items: { type: object } }
                  cardInfo:
                    type: object
                    nullable: true
                  timestamp: { type: string }
components:
  securitySchemes: {}
