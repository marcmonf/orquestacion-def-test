openapi: 3.1.0
info:
  title: Monetiser Orchestrator API
  version: 0.3.0
servers:
  - url: https://api.monetiser.example
paths:
  /initialize:
    post:
      summary: Inicializa un pago y devuelve paymentId y enlaces del iFrame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantId, amount, currency, returnUrl, callbackUrl, method]
              properties:
                merchantId: { type: string }
                amount: { type: number }
                currency: { type: string }
                method: { type: string }
                returnUrl: { type: string, format: uri }
                callbackUrl: { type: string, format: uri }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  paymentId: { type: string }
                  merchantId: { type: string }
                  amount: { type: number }
                  currency: { type: string }
                  signature: { type: string }
                  timestamp: { type: string }
                  expiresAt: { type: string }
                  iframeUrl: { type: string, format: uri }
                  iframeParams:
                    type: object
                    properties:
                      nonce: { type: string }
                      exp: { oneOf: [{ type: integer }, { type: string }] }
                      signature: { type: string }
                      iframeUrl: { type: string, format: uri }

  /iframe:
    get:
      summary: Carga HPP/iFrame seguro
      parameters:
        - in: query
          name: merchantId
          schema: { type: string }
        - in: query
          name: paymentId
          required: true
          schema: { type: string }
        - in: query
          name: nonce
          schema: { type: string }
        - in: query
          name: exp
          required: true
          schema: { oneOf: [{ type: integer }, { type: string }] }
        - in: query
          name: signature
          required: true
          schema: { type: string }
      responses:
        '200': { description: HTML iFrame }
        '403': { description: Firma inválida }
        '409': { description: Reuso/nonce inválido }
        '410': { description: Expirada }

  /orchestration/decide:
    post:
      summary: Evalúa reglas y sugiere conector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantId, amount, currency, method]
              properties:
                paymentId: { type: string }
                merchantId: { type: string }
                amount: { type: number }
                currency: { type: string }
                method: { type: string, enum: ["card","apm"] }
                cardNumber: { type: string }
                cardInfo:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Decisión calculada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  paymentId: { type: string, nullable: true }
                  decision:
                    type: object
                    properties:
                      connector: { type: string }
                      matchedRuleId: { type: string, nullable: true }
                      reasons: { type: array, items: { type: string } }
                      explain: { type: array, items: { type: object } }
                  cardInfo:
                    type: object
                    nullable: true
                  timestamp: { type: string }

  /rules/{merchantId}:
    get:
      summary: Obtiene la política actual del merchant
      parameters:
        - in: path
          name: merchantId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Política actual
    put:
      summary: Crea/actualiza la política del merchant
      parameters:
        - in: path
          name: merchantId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '200': { description: OK }

  /rules/validate:
    post:
      summary: Valida una política sin guardarla
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '200': { description: Válida }

  /rules/try:
    post:
      summary: Prueba una política con un input de muestra y devuelve explicación legible
      responses:
        '200':
          description: Resultado de prueba
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  decision:
                    type: object
                    properties:
                      connector: { type: string }
                      matchedRuleId: { type: string, nullable: true }
                      reasons: { type: array, items: { type: string } }
                  explainHuman: { type: array, items: { type: string } }

  /rules/{merchantId}/audit:
    get:
      summary: Devuelve el histórico de cambios
      parameters:
        - in: path
          name: merchantId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200': { description: OK }

components:
  schemas:
    Policy:
      type: object
      required: [merchantId, version, defaultConnector, rules]
      properties:
        merchantId: { type: string }
        version: { type: string, enum: ["v1"] }
        defaultConnector: { type: string }
        rules:
          type: array
          items:
            type: object
            required: [id, when, action]
            properties:
              id: { type: string }
              priority: { type: integer }
              when:
                type: object
                additionalProperties: true
              action:
                type: object
                properties:
                  route: { type: string }
