openapi: 3.1.0

info:
  title: Monetiser — Payment Orchestration Platform API
  version: 2.6.0
  summary: API real de Monetiser, generada leyendo el código (no una API idealizada).
  description: |
    Contrato REAL de la API de Monetiser, extraído de los DTOs, validators y
    controllers del repositorio `marcmonf/orquestacion-def-test`. Cada campo de
    esta spec existe en el código; no hay campos inventados ni aspiracionales.

    **v2.6.0 (20 jul 2026)** — M7 Fase 2 (cierre/finalización de facturas). Una
    factura de un período CERRADO se puede FINALIZAR (congelar): queda inmutable
    con nº de factura y snapshot de precios. `GET /portal/invoices` lista las
    facturas emitidas del merchant; `GET /portal/billing/{period}` devuelve la
    factura finalizada (`finalized: true`) si existe, o un borrador vivo. El
    superadmin finaliza con `POST /backoffice/billing[/{merchantId}]/finalize`
    (plano backoffice, no en esta spec). El cobro real (Stripe/Paddle) sigue siendo
    la Fase 3.

    **v2.5.0 (20 jul 2026)** — M7 Fase 1 (billing, MEDICIÓN — sin cobro real todavía).
    `GET /portal/billing` y `GET /portal/billing/{period}`: la factura-borrador del
    merchant de la sesión (solo `merchant_admin`, scoped). Modelo de precios flexible
    (cuota mensual + fee por transacción + % de volumen, en céntimos); factura sobre
    transacciones facturables (approved/authorized/captured). El superadmin fija los
    precios con `GET/PUT /backoffice/pricing` (plano backoffice, no en esta spec, como
    el resto de `/backoffice/*`). El cobro real (Stripe/Paddle) es la Fase 3.

    **v2.4.0 (20 jul 2026)** — M6 Fases 3 y 4. **Fase 3 (datos del portal):**
    `GET /portal/transactions`, `GET /portal/transactions/{paymentId}` y
    `GET /portal/analytics/summary` — solo lectura, scoped a la sesión (una
    transacción de otro merchant → 404). Portal visual servido en `/portal-app`
    (SPA, no forma parte de esta spec de API). **Fase 4 (permisos por nodo):** el
    JWT del portal lleva ahora `hierarchyNodeId`; un `merchant_admin` asigna un
    usuario a un nodo con `PATCH /portal/users/{userId}` (`hierarchyNodeId`). Un
    usuario asignado a un nodo solo ve/gestiona su subárbol en `/portal/hierarchy`
    (fuera de él: 404 al leer/editar/borrar, 403 `outside_your_scope` al crear/mover).
    Las transacciones aún NO llevan referencia de nodo, así que su visibilidad
    sigue siendo a nivel de merchant.

    **v2.3.0 (20 jul 2026)** — M6 Fase 2: **jerarquía de tiendas** por tenant.
    Nuevas rutas `/portal/hierarchy` (árbol globalGroup → group → branch → region →
    store, lista de adyacencia con `parentId`). CRUD scoped a la sesión: el
    `merchantId` sale de la sesión; los nodos de otro merchant no existen (404), y
    un `parentId` que apunte a otro tenant tampoco (no se puede colgar el árbol
    propio de otro merchant). Lectura para cualquier usuario del portal; escritura
    solo `merchant_admin`. El padre debe ser de nivel superior (regla que además
    impide ciclos). La jerarquía vieja (registro plano `MerchantHierarchy`) se
    rehízo como árbol (`HierarchyNode`, colección `hierarchynodes`).

    **v2.2.0 (20 jul 2026)** — M6 Fase 1: **portal del merchant** (plano de
    usuarios de merchant, separado del backoffice interno). Nuevas rutas
    `/portal/*`: login con JWT propio (`PortalBearer`, aud `portal`), cambio de
    password temporal obligatorio en el primer login, y CRUD de usuarios del
    merchant por el `merchant_admin`. **Aislamiento de tenant en servidor:** todo
    endpoint del portal filtra por el `merchantId` de la SESIÓN, nunca por uno que
    venga del cliente; un usuario de otro merchant no existe para la sesión (404).
    El primer `merchant_admin` lo crea el superadmin interno vía
    `POST /backoffice/merchants/{merchantId}/portal-users` (plano backoffice, no
    documentado aquí como el resto de `/backoffice/*`). Roles v1 fijos:
    `merchant_admin` / `merchant_operator` / `merchant_viewer`.

    **v2.1.0 (18 jul 2026)** — S2S pasa a **tokens-only** (decisión ratificada,
    ver DEV-LOG sección 5). `POST /{merchantId}/payments/server` ya **no acepta el
    PAN** (`cardNumber`/`cvv`): lo rechaza con `400 card_data_not_accepted` y exige
    el `source_uuid` de ProxyFields. Se implementó `authorize()` en
    `payNoPainConnector.js` (sobre `chargeWithToken`, DEFERRED), así que enrutar
    S2S a `payNoPain` ya no revienta. El endpoint deja de estar `deprecated`; pasa
    de `experimental` a `beta` (contrato cerrado, aún sin verificar end-to-end
    contra Paylands real). Monetiser se mantiene en scope PCI SAQ A también en S2S.

    **v2.0.0 (17 jul 2026)** — cambios de contrato (sin merchants integrados):
    retirado `/initialize` (legado); todos los webhooks salientes unificados en
    una única firma (`Monetiser-Signature`, secreto por-merchant, reintentos,
    registro); evento `payment.canceled` renombrado a `payment.cancelled`.
    Retirados también del servidor (nunca estuvieron en esta spec): `/tokens`,
    `/payment-requests`, `POST /transactions/card-payment` y el CRUD de
    escritura de `/transactions`.

    ## Cómo leer esta spec

    Cada operación lleva una etiqueta de madurez en `x-madurez`:

    | Marca | Significado |
    |---|---|
    | `estable` | Verificado end-to-end contra Paylands real. Integrable hoy. |
    | `beta` | Contrato cerrado e implementado, pero **aún sin verificar end-to-end contra Paylands real**. Integrable con cautela. |
    | `experimental` | El contrato VA A CAMBIAR. No integrar. |
    | `interno` | Lo usa el iFrame o el dashboard de Monetiser, no el merchant. |
    | `legado` | Anterior al diseño actual. Se mantiene por compatibilidad. |

    ## Importes: SIEMPRE en céntimos

    `amountOfMoney.amount` y `amount` son **enteros en céntimos**, estilo Paylands.
    `100` = 1,00 €. Nunca decimales. Es la causa de bugs más repetida del proyecto.

    ## Estados de una transacción

    ```
    pending → pending_3ds → authorized ─┬─ captured / partially_captured
                                        ├─ cancelled  (solo antes de capturar)
                                        └─ refunded / partially_refunded
                          → declined
                          → error
    ```

    ## Scope PCI (decisión de 16 jul 2026)

    Monetiser opera en scope **PCI SAQ A**: el número de tarjeta (PAN) nunca toca
    sus servidores. Los datos de tarjeta se capturan en campos ProxyFields de
    Paylands embebidos en el iFrame y se tokenizan en Paylands.

    Esto vale **también para S2S** (`POST /{merchantId}/payments/server`) desde
    v2.1.0: el endpoint es **tokens-only**. Rechaza el PAN en crudo
    (`cardNumber`/`cvv`) con `400 card_data_not_accepted` y solo acepta el
    `source_uuid` que ProxyFields generó al tokenizar la tarjeta. No queda ningún
    flujo por el que el PAN entre a Monetiser. Ver DEV-LOG.md, sección 5.

  contact:
    name: Repositorio y estado del proyecto
    url: https://github.com/marcmonf/orquestacion-def-test
  license:
    name: Propietario

servers:
  - url: https://orquestacion-def-test.onrender.com
    description: Entorno de pruebas (Paylands sandbox). Hoy el único desplegado.

tags:
  - name: Hosted Checkout
    description: |
      **Flujo recomendado y único verificado end-to-end.** El merchant crea el pago
      sin datos de tarjeta y recibe una `redirectUrl` que embebe en un iframe.
  - name: Ciclo de vida
    description: |
      Capture, refund y cancel sobre un pago ya autorizado. Verificados contra
      Paylands real el 16 jul 2026.

      **Requisito:** la orden debe haberse creado con `operative: DEFERRED` (es lo
      que hace el conector hoy). Con `AUTHORIZATION` el dinero se mueve al instante
      y no hay nada que confirmar ni cancelar.
  - name: Webhooks
    description: Notificaciones entrantes (Paylands → Monetiser) y salientes (Monetiser → merchant).
  - name: S2S
    description: |
      **BETA — tokens-only.** Pago server-to-server con el `source_uuid` de
      ProxyFields (nunca el PAN). Contrato cerrado; pendiente de verificación
      end-to-end contra Paylands real. Ver `x-madurez` y la nota de scope PCI arriba.
  - name: Reglas de routing
    description: Motor de reglas que decide a qué conector va cada transacción.
  - name: Administración
    description: Alta de merchants y gestión de API keys. Requiere `X-Admin-Token`.
  - name: Observabilidad
    description: Consulta de transacciones y eventos.
  - name: Interno
    description: Endpoints que consume el propio iFrame de Monetiser, no el merchant.
  - name: Portal
    description: |
      **Portal del merchant (M6).** Plano de usuarios de merchant, SEPARADO del
      backoffice interno de Monetiser. Los usuarios de un comercio entran con un
      JWT propio (`PortalBearer`, audience `portal`) y solo ven/gestionan SU
      merchant: el `merchantId` sale siempre de la sesión, nunca del cliente.

      El **primer** `merchant_admin` de un comercio lo crea el superadmin interno
      (`POST /backoffice/merchants/{merchantId}/portal-users`, plano backoffice).
      A partir de ahí, el `merchant_admin` gestiona a los suyos desde `/portal/users`.

security:
  - ApiKeySimple: []
    MerchantId: []

paths:

  # ──────────────────────────────────────────────────────────────────────
  # HOSTED CHECKOUT
  # ──────────────────────────────────────────────────────────────────────

  /{merchantId}/payments/hosted:
    post:
      tags: [Hosted Checkout]
      summary: Crear un Hosted Checkout
      operationId: createHostedCheckout
      x-madurez: estable
      description: |
        Crea una transacción y devuelve una `redirectUrl` que el merchant embebe en
        un `<iframe>`. **El body no lleva datos de tarjeta** — se capturan después en
        el iFrame vía ProxyFields de Paylands.

        Contrato leído de `src/dtos/hostedCheckoutDTO.js` (`HostedCheckoutRequestDTO`).

        El `merchantId` se lee de la URL y **no forma parte del body**.
      security:
        - ApiKeySimple: []
          MerchantId: []
        - HmacV1: []
          MerchantId: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedCheckoutRequest'
            examples:
              minimo:
                summary: Lo mínimo que acepta (verificado)
                value:
                  order:
                    amountOfMoney:
                      amount: 100
                      currencyCode: EUR
                  feedbacks:
                    returnUrl: https://example.com/return
                    webhookUrl: https://example.com/webhooks/monetiser
      responses:
        '200':
          description: Checkout creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedCheckoutCreateResponse'
        '400':
          description: Body inválido según el DTO, o importe no válido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Error interno.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /{merchantId}/payments/hosted/{hostedCheckoutId}/status:
    get:
      tags: [Hosted Checkout]
      summary: Consultar el estado de un Hosted Checkout
      operationId: getHostedCheckoutStatus
      x-madurez: estable
      description: |
        Estado actual del checkout. Contrato de respuesta leído de
        `buildHostedCheckoutStatusResponse` en `src/dtos/hostedCheckoutDTO.js`.

        Es una alternativa al webhook para conocer el desenlace del pago, pero el
        webhook es el mecanismo recomendado: este endpoint hay que sondearlo.
      security:
        - ApiKeySimple: []
          MerchantId: []
        - HmacV1: []
          MerchantId: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
        - name: hostedCheckoutId
          in: path
          required: true
          description: El `hostedCheckoutId` devuelto al crear el checkout.
          schema: { type: string }
      responses:
        '200':
          description: Estado del checkout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedCheckoutStatusResponse'
        '400':
          description: Falta el `hostedCheckoutId`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No existe un checkout con ese id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Error interno.

  # ──────────────────────────────────────────────────────────────────────
  # CICLO DE VIDA
  # ──────────────────────────────────────────────────────────────────────

  /payments/{paymentId}/capture:
    post:
      tags: [Ciclo de vida]
      summary: Capturar (confirmar) un pago autorizado
      operationId: capturePayment
      x-madurez: estable
      description: |
        Confirma el cobro de un pago en estado `authorized`. Internamente llama a
        `POST /payment/confirmation` de Paylands.

        **Ojo con el contrato:** este endpoint usa `amount` **plano** (entero, en
        céntimos), a diferencia de `refund` y `cancel`, que usan
        `amountOfMoney.amount`. Es una inconsistencia real del código
        (`captureSchema` vs `refundSchema` en `src/validators/paymentValidator.js`),
        documentada aquí tal cual es. Si `amount` se omite, se captura el importe
        pendiente completo.

        El `merchantId` NO va en la URL: se resuelve desde el header `x-merchant-id`.
        Una transacción de otro merchant devuelve `404`, no `403`.

        El validator rechaza campos desconocidos (`allowUnknown: false`).
      security:
        - ApiKeySimple: []
          MerchantId: []
        - HmacV1: []
          MerchantId: []
      parameters:
        - $ref: '#/components/parameters/PaymentIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
            examples:
              total:
                summary: Capturar todo lo pendiente (verificado — body vacío)
                value: {}
              parcial:
                summary: Capturar 1,00 € de una autorización mayor
                value:
                  amount: 100
                  isFinal: true
      responses:
        '200':
          description: Capturado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureResponse'
        '400':
          $ref: '#/components/responses/BadIdempotencyKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            La transacción no existe **o pertenece a otro merchant**.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: |
            Conflicto de estado. Mensajes reales que devuelve:
            - `Cannot capture payment in status '<status>'`
            - `Invalid capture amount`
            - `Capture exceeds authorized amount`
            - `capture.missing_processor_reference`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: |
            `capture.connector_not_configured` o `capture.error`.
        '502':
          $ref: '#/components/responses/ProcessorDeclined'

  /payments/{paymentId}/refund:
    post:
      tags: [Ciclo de vida]
      summary: Reembolsar un pago (total o parcial)
      operationId: refundPayment
      x-madurez: estable
      description: |
        Devuelve dinero al cardholder. Internamente llama a `POST /payment/refund`
        de Paylands. Verificado end-to-end (total y parcial).

        **Prerequisito (operativa `DEFERRED`, verificado en vivo 18 jul 2026):** el
        pago debe estar **capturado**. Sobre un pago `authorized` sin capturar no hay
        dinero movido que reembolsar: Paylands responde `409 Conflict` y Monetiser lo
        devuelve como `502 refund.processor_declined`. Las operaciones válidas sobre
        una autorización sin capturar son `capture` o `cancel`.

        Usa `amountOfMoney.amount` (entero, céntimos). Si se omite, se reembolsa el
        importe reembolsable restante completo.

        Si no hay una operación de `capture` previa registrada, la base reembolsable
        es el **importe autorizado** (se corrigió así porque el flujo actual no
        siempre pasa por una captura explícita).

        El validator rechaza campos desconocidos (`allowUnknown: false`).
      security:
        - ApiKeySimple: []
          MerchantId: []
        - HmacV1: []
          MerchantId: []
      parameters:
        - $ref: '#/components/parameters/PaymentIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
            examples:
              parcial:
                summary: Reembolso parcial de 1,00 € (verificado)
                value:
                  amountOfMoney:
                    amount: 100
                    currencyCode: EUR
              total:
                summary: Reembolso total (body vacío)
                value: {}
      responses:
        '200':
          description: Reembolsado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '400':
          $ref: '#/components/responses/BadIdempotencyKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La transacción no existe o pertenece a otro merchant.
        '409':
          description: |
            Conflicto de estado. Mensajes reales:
            - `Cannot refund payment in status '<status>'`
            - `Invalid refund amount`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: '`refund.error`.'
        '502':
          $ref: '#/components/responses/ProcessorDeclined'

  /payments/{paymentId}/cancel:
    post:
      tags: [Ciclo de vida]
      summary: Anular un pago autorizado sin capturar
      operationId: cancelPayment
      x-madurez: estable
      description: |
        Libera la retención de una autorización **antes de capturarla**.
        Internamente llama a `POST /payment/cancellation` de Paylands.

        Si el pago ya se capturó, esto no sirve: hay que usar `refund`.

        Verificado end-to-end el 16 jul 2026 con body vacío.

        El validator rechaza campos desconocidos (`allowUnknown: false`).
      security:
        - ApiKeySimple: []
          MerchantId: []
        - HmacV1: []
          MerchantId: []
      parameters:
        - $ref: '#/components/parameters/PaymentIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
            examples:
              verificado:
                summary: Anulación (verificado — body vacío)
                value: {}
      responses:
        '200':
          description: |
            Anulado, con `status: "cancelled"` (dos `l`, la grafía de Paylands).

            > **Cambio de contrato (16 jul 2026):** antes respondía y persistía
            > `canceled` (una `l`), lo que dejaba el pago en `completed: false`
            > indefinidamente en el endpoint de status. Corregido: ahora responde y
            > persiste `cancelled`, alineado con Paylands, con el webhook y con el
            > dashboard. Si tenías código comparando con `"canceled"`, actualízalo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResponse'
        '400':
          $ref: '#/components/responses/BadIdempotencyKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: La transacción no existe o pertenece a otro merchant.
        '409':
          description: Estado no anulable (por ejemplo, ya capturado).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: '`cancel.error`.'
        '502':
          $ref: '#/components/responses/ProcessorDeclined'

  # ──────────────────────────────────────────────────────────────────────
  # S2S — EXPERIMENTAL
  # ──────────────────────────────────────────────────────────────────────

  /{merchantId}/payments/server:
    post:
      tags: [S2S]
      summary: '[BETA] Pago server-to-server (tokens-only)'
      operationId: createServerPayment
      x-madurez: beta
      description: |
        Pago server-to-server **tokens-only** (desde v2.1.0). El merchant envía el
        `source_uuid` que ProxyFields de Paylands generó al tokenizar la tarjeta.
        Monetiser se mantiene en scope PCI SAQ A: el PAN nunca entra por aquí.

        **Cómo se envía el token** (uno de los dos, equivalentes):
        - Campo raíz `source_uuid` (grafía nativa de Paylands), o
        - `cardPaymentMethodSpecificInput.token` (grafía Worldline).

        **Rechazos explícitos:**
        - `cardNumber` o `cvv` en crudo → `400 card_data_not_accepted` (SAQ A).
        - Sin token → `400 missing_card_token`.

        **Comportamiento por conector** (lo decide el rule engine del merchant):
        - `dummyCard` (política por defecto) → autoriza de inmediato → `authorized`.
        - `payNoPain` (Paylands real) → `authorize()` reutiliza `chargeWithToken`
          (operative `DEFERRED`) y devuelve un challenge 3DS tokenizado: la respuesta
          trae `status: pending_3ds` y `merchantAction.actionType: REDIRECT` con la
          URL de 3DS. El cardholder se autentica y Paylands cierra la transacción por
          webhook (`POST /webhooks/paynopain`, que localiza la tx por
          `processorReference`).

        > **`beta`:** el contrato ya está cerrado (tokens-only) y `payNoPainConnector`
        > tiene `authorize()`, pero este flujo **no se ha verificado end-to-end contra
        > Paylands real** todavía. Para transacciones de prueba fiables contra Paylands,
        > sigue prefiriéndose Hosted Checkout.
      security:
        - ApiKeySimple: []
          MerchantId: []
        - HmacV1: []
          MerchantId: []
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerPaymentRequest'
      responses:
        '200':
          description: |
            Resultado del pago. `status` puede ser `authorized` (dummyCard),
            `pending_3ds` (payNoPain — con `merchantAction.REDIRECT` a la URL 3DS)
            o `declined`.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: |
            Body inválido. Casos propios de tokens-only: `card_data_not_accepted`
            (llega PAN/cvv en crudo) y `missing_card_token` (falta el source_uuid).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Error interno.

  # ──────────────────────────────────────────────────────────────────────
  # WEBHOOK ENTRANTE
  # ──────────────────────────────────────────────────────────────────────

  /webhooks/paynopain:
    post:
      tags: [Webhooks]
      summary: Webhook entrante de Paylands (PSP → Monetiser)
      operationId: paynopainWebhook
      x-madurez: estable
      security: []
      description: |
        Lo llama Paylands, no el merchant. **Sin autenticación por API key** — la
        autenticidad se comprueba con el `validation_hash` del propio body.

        ### Verificación de la firma

        Implementada en `src/routes/webhooks.js`:

        ```
        expected = SHA256_hex( JSON.stringify(hashObj) + PAYNOPAIN_SIGNATURE )
        ```

        donde `hashObj` se construye **solo con los campos presentes**:

        ```js
        hashObj = { order: body.order || null, client: body.client || null }
        // extra_data se añade SOLO si body.extra_data !== undefined
        ```

        Detalle que costó una sesión de depuración: incluir `extra_data: null`
        cuando no viene en el body produce un hash distinto y la firma nunca valida.

        La comparación es timing-safe (`crypto.timingSafeEqual`).

        ### Por qué siempre responde 200

        Este endpoint devuelve `200` **incluso cuando rechaza el evento** (firma
        inválida, transacción no encontrada, o `PAYNOPAIN_SIGNATURE` sin configurar).
        Es deliberado: un no-2xx haría que Paylands reintentase indefinidamente. Los
        eventos rechazados responden `{"received": true, "ignored": true}` y quedan
        registrados en los logs.

        **Consecuencia operativa:** un `200` aquí NO significa que el pago se haya
        procesado. Para saberlo hay que mirar `webhookevents` en Mongo o los logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaylandsWebhookBody'
      responses:
        '200':
          description: |
            Recibido. Tres formas posibles — ver ejemplos.
          content:
            application/json:
              examples:
                procesado:
                  summary: Evento válido y aplicado
                  value:
                    received: true
                    paymentId: a0408ee0-ba65-4dc7-bccb-6c3a778f8c83
                    status: authorized
                ignorado:
                  summary: Firma inválida o tx no encontrada (también 200)
                  value:
                    received: true
                    ignored: true
                sinSecreto:
                  summary: PAYNOPAIN_SIGNATURE no configurada en el entorno
                  value:
                    received: true
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  ignored: { type: boolean }
                  paymentId: { type: string }
                  status: { type: string }
        '500':
          description: '`db_error` — fallo al actualizar la transacción.'

  /webhooks:
    get:
      tags: [Observabilidad]
      summary: Histórico de eventos de webhook entrantes
      operationId: listWebhookEvents
      x-madurez: estable
      parameters:
        - name: paymentId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Lista de `WebhookEvent`.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '500':
          description: Error interno.

  # ──────────────────────────────────────────────────────────────────────
  # ADMINISTRACIÓN
  # ──────────────────────────────────────────────────────────────────────

  /merchants:
    post:
      tags: [Administración]
      summary: Crear un merchant
      operationId: createMerchant
      x-madurez: estable
      security: [{ AdminToken: [] }]
      description: |
        Los secretos (`signingSecret`, etc.) **nunca** se devuelven en la respuesta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantCreateRequest'
            examples:
              ejemplo:
                summary: Alta verificada
                value:
                  merchantId: test-m2
                  name: Comercio de prueba
                  country: ES
                  plan: starter
                  status: active
                  webhookUrl: https://example.com/webhooks/monetiser
      responses:
        '201':
          description: Merchant creado (sin secretos en la respuesta).
        '400':
          description: Datos inválidos.
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '409':
          description: Ya existe un merchant con ese `merchantId`.
    get:
      tags: [Administración]
      summary: Listar merchants
      operationId: listMerchants
      x-madurez: estable
      security: [{ AdminToken: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: q
          in: query
          description: Búsqueda por texto.
          schema: { type: string }
      responses:
        '200':
          description: Lista paginada.
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'

  /merchants/{merchantId}:
    get:
      tags: [Administración]
      summary: Obtener un merchant
      operationId: getMerchant
      x-madurez: estable
      security: [{ AdminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
      responses:
        '200':
          description: Ficha del merchant (sin secretos).
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '404':
          description: No existe.
    patch:
      tags: [Administración]
      summary: Actualizar un merchant
      operationId: updateMerchant
      x-madurez: estable
      security: [{ AdminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantPatchRequest'
      responses:
        '200':
          description: Actualizado.
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '404':
          description: No existe.

  /api-keys/{merchantId}:
    post:
      tags: [Administración]
      summary: Crear una API key para un merchant
      operationId: createApiKey
      x-madurez: estable
      security: [{ AdminToken: [] }]
      description: |
        **El `rawSecret` se devuelve UNA SOLA VEZ**, en esta respuesta. No se puede
        recuperar después: en Mongo solo queda su hash.

        Ver la nota sobre qué es realmente `x-api-key` en el esquema de seguridad
        `ApiKeySimple` — hoy el header lleva el `rawKeyId`, no el `rawSecret`.
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: Etiqueta para identificar la key.
                expiresAt:
                  type: string
                  format: date-time
                  description: Opcional. Se verifica en cada validación.
      responses:
        '201':
          description: Key creada. Única vez que se ve el `rawSecret`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreateResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
    get:
      tags: [Administración]
      summary: Listar las API keys activas de un merchant
      operationId: listApiKeys
      x-madurez: estable
      security: [{ AdminToken: [] }]
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
      responses:
        '200':
          description: Lista de keys (sin secretos ni hashes).
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'

  /api-keys/{merchantId}/{keyId}:
    delete:
      tags: [Administración]
      summary: Revocar una API key
      operationId: revokeApiKey
      x-madurez: estable
      security: [{ AdminToken: [] }]
      description: 'Marca la key como `active: false` y sella `revokedAt`. No la borra.'
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Revocada.
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
        '404':
          description: No existe.

  # ──────────────────────────────────────────────────────────────────────
  # REGLAS DE ROUTING
  # ──────────────────────────────────────────────────────────────────────

  /rules/{merchantId}:
    get:
      tags: [Reglas de routing]
      summary: Obtener la política de routing de un merchant
      operationId: getPolicy
      x-madurez: estable
      security: [{ AdminToken: [] }]
      description: No depende de ningún feature flag. Siempre disponible.
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
      responses:
        '200':
          description: Política actual.
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'
    put:
      tags: [Reglas de routing]
      summary: Crear o actualizar la política de routing
      operationId: upsertPolicy
      x-madurez: estable
      security: [{ AdminToken: [] }]
      description: |
        No depende de ningún feature flag.

        **Aviso de auditoría:** la entrada de auditoría de este cambio solo se
        escribe si `FEATURE_RULE_AUDIT=1`. Con el flag apagado el cambio se guarda
        **sin rastro de autor**, y ese histórico no se puede reconstruir después.
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
        - name: x-admin-actor
          in: header
          required: false
          description: |
            Actor que queda registrado en la auditoría. Desde el dashboard se
            rellena solo con el email de la sesión. Si falta, se guarda `unknown`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Policy' }
      responses:
        '200':
          description: Guardada.
        '400':
          description: Política inválida.
        '401':
          $ref: '#/components/responses/UnauthorizedAdmin'

  /rules/validate:
    post:
      tags: [Reglas de routing]
      summary: Validar una política sin guardarla
      operationId: validatePolicy
      x-madurez: estable
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Policy' }
      responses:
        '200':
          description: Política válida (devuelve la versión normalizada).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  normalized: { $ref: '#/components/schemas/Policy' }
        '400':
          description: Política inválida.

  /rules/try:
    post:
      tags: [Reglas de routing]
      summary: Probar una política contra una transacción de ejemplo (dry-run)
      operationId: tryPolicy
      x-madurez: estable
      security: [{ AdminToken: [] }]
      description: |
        **Requiere `FEATURE_RULE_TRY=1`.** Si el flag no está, devuelve
        `404 {"success": false, "error": "disabled"}` — no es un error de la
        petición, es la función apagada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                policy: { $ref: '#/components/schemas/Policy' }
                sample:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Decisión que tomaría el motor, con explicación legible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  decision: { $ref: '#/components/schemas/RuleDecision' }
                  explainHuman:
                    type: array
                    items: { type: string }
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /rules/{merchantId}/audit:
    get:
      tags: [Reglas de routing]
      summary: Histórico de cambios de la política
      operationId: getPolicyAudit
      x-madurez: estable
      security: [{ AdminToken: [] }]
      description: '**Requiere `FEATURE_RULE_AUDIT=1`.**'
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Entradas de auditoría (hashes previo/siguiente, actor, ip, campos cambiados).
        '404':
          $ref: '#/components/responses/FeatureDisabled'

  /orchestration/decide:
    post:
      tags: [Reglas de routing]
      summary: Consultar qué conector elegiría el motor de reglas
      operationId: orchestrationDecide
      x-madurez: estable
      description: Solo consulta. No crea ninguna transacción ni mueve dinero.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantId, amount, currency, method]
              properties:
                paymentId: { type: string }
                merchantId: { type: string }
                amount: { type: number }
                currency: { type: string }
                method: { type: string, enum: [card, apm] }
                cardNumber: { type: string }
                cardInfo:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: Decisión calculada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  paymentId: { type: string }
                  decision: { $ref: '#/components/schemas/RuleDecision' }
                  cardInfo:
                    type: object
                    additionalProperties: true
                  timestamp: { type: string, format: date-time }

  # ──────────────────────────────────────────────────────────────────────
  # INTERNO / LEGADO
  # ──────────────────────────────────────────────────────────────────────

  /hpp/{hostedCheckoutId}:
    get:
      tags: [Interno]
      summary: Redirigir al iFrame firmado
      operationId: hppRedirect
      x-madurez: interno
      security: []
      description: |
        Destino de la `redirectUrl`. Construye una URL firmada y hace un `302` al
        iFrame. Lo abre el navegador del cardholder, no el backend del merchant.
      parameters:
        - name: hostedCheckoutId
          in: path
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirección a `/{merchantId}/iframe?paymentId=...`.
        '404':
          description: No existe.

  /{merchantId}/iframe:
    get:
      tags: [Interno]
      summary: Servir el iFrame de checkout
      operationId: getIframe
      x-madurez: interno
      security: []
      description: |
        Devuelve el HTML del checkout con el branding del merchant y los campos
        ProxyFields de Paylands embebidos.

        `frame-ancestors: *` — deliberado, para que cualquier merchant pueda
        embeberlo. `X-Frame-Options` se elimina explícitamente por el mismo motivo.

        Los parámetros `exp` y `signature` solo se exigen si `FEATURE_IFRAME_GUARD=1`.
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
        - name: paymentId
          in: query
          required: true
          schema: { type: string }
        - name: exp
          in: query
          required: false
          schema: { type: string }
        - name: signature
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: HTML del iFrame.
          content:
            text/html:
              schema: { type: string }
        '403':
          description: Firma inválida (con `FEATURE_IFRAME_GUARD=1`).
        '409':
          description: Reuso o estado no inicializado.
        '410':
          description: Enlace expirado.

  /{merchantId}/proxy-pci/session:
    post:
      tags: [Interno]
      summary: Obtener un token de sesión del Proxy PCI
      operationId: proxyPciSession
      x-madurez: interno
      description: |
        Lo llama el iFrame, no el merchant. Devuelve el token que ProxyFields usa
        para tokenizar el PAN contra Paylands.
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
      responses:
        '200':
          description: Token de sesión emitido.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{merchantId}/proxy-pci/charge:
    post:
      tags: [Interno]
      summary: Cobrar con el card UUID tokenizado
      operationId: proxyPciCharge
      x-madurez: interno
      description: |
        Lo llama el iFrame tras el submit del formulario. Recupera el card UUID de
        ProxyFields y lanza el cobro contra Paylands.

        Devuelve normalmente `status: pending_3ds` más una `threeDsUrl`: el
        desenlace real llega después por webhook, no en esta respuesta.
      parameters:
        - $ref: '#/components/parameters/MerchantIdPath'
      responses:
        '200':
          description: Cobro lanzado (normalmente `pending_3ds` + `threeDsUrl`).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Transacción no encontrada.
        '409':
          description: 'Transacción en estado no válido: `<status>`.'
        '422':
          description: |
            No hay token PCI para esta transacción — el cardholder no completó el
            formulario.

  # ──────────────────────────────────────────────────────────────────────
  # PORTAL DEL MERCHANT (M6)
  # ──────────────────────────────────────────────────────────────────────

  /portal/auth/login:
    post:
      tags: [Portal]
      summary: Login del portal del merchant
      operationId: portalLogin
      x-madurez: estable
      security: []
      description: |
        Autentica a un usuario de merchant y devuelve un JWT de portal. **Rate
        limited** por IP + email (`RL_PORTAL_LOGIN_MAX`, por defecto 10/15 min):
        superado el límite responde `429`.

        Si `mustChangePassword` es `true`, el token sirve únicamente para
        `POST /portal/auth/change-password`; el resto del portal responde `403`
        hasta cambiar la password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalLoginRequest'
      responses:
        '200':
          description: Login correcto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalLoginResponse'
        '400':
          description: Faltan credenciales.
        '401':
          description: Credenciales inválidas o usuario inactivo (`invalid_credentials`).
        '429':
          description: Demasiados intentos (`rate_limit_exceeded`).

  /portal/auth/change-password:
    post:
      tags: [Portal]
      summary: Cambiar la propia password (limpia mustChangePassword)
      operationId: portalChangePassword
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: |
        Cambia la password del usuario de la sesión. Permitido incluso bajo
        `mustChangePassword` (es como se limpia el flag en el primer login).
        Devuelve un token fresco con el flag ya a `false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalChangePasswordRequest'
      responses:
        '200':
          description: Password actualizada. Devuelve un token nuevo.
        '400':
          description: Falta algún campo, la nueva es menor de 8 caracteres o igual a la actual.
        '401':
          description: Sin token, token inválido, o `currentPassword` incorrecta.

  /portal/me:
    get:
      tags: [Portal]
      summary: Datos del usuario de la sesión
      operationId: portalMe
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: |
        Devuelve el usuario de la sesión (resuelto por `merchantId` de sesión).
        Accesible aún bajo `mustChangePassword`.
      responses:
        '200':
          description: Usuario de la sesión (proyección pública, sin hash).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  user: { $ref: '#/components/schemas/MerchantUserPublic' }
        '401':
          description: Sin token o token inválido.

  /portal/users:
    get:
      tags: [Portal]
      summary: Listar usuarios del PROPIO merchant
      operationId: portalListUsers
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: |
        Lista solo los usuarios del merchant de la sesión (nunca de otro). Solo
        `merchant_admin`. Un `merchantId` en query/body se ignora.
      responses:
        '200':
          description: Usuarios del merchant de la sesión (sin hash).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/MerchantUserPublic' }
        '401':
          description: Sin token o token inválido.
        '403':
          description: Rol insuficiente (`insufficient_permissions`) o password sin cambiar (`password_change_required`).
    post:
      tags: [Portal]
      summary: Crear un usuario en el PROPIO merchant
      operationId: portalCreateUser
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: |
        Crea un usuario en el merchant de la SESIÓN (cualquier `merchantId` del
        body se ignora). Solo `merchant_admin`. Genera una **password temporal**
        que se devuelve UNA sola vez; el nuevo usuario entra con `mustChangePassword`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalUserCreateRequest'
      responses:
        '201':
          description: Usuario creado (incluye `tempPassword`, visible una vez).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUserCreateResponse'
        '400':
          description: Faltan campos o rol inválido.
        '401':
          description: Sin token o token inválido.
        '403':
          description: Rol insuficiente o password sin cambiar.
        '409':
          description: Ya existe un usuario con ese email (`email_already_exists`).

  /portal/users/{userId}:
    patch:
      tags: [Portal]
      summary: Editar nombre/rol/estado de un usuario del PROPIO merchant
      operationId: portalUpdateUser
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: |
        Edita un usuario del merchant de la sesión. Se resuelve SIEMPRE con el
        `merchantId` de sesión: un usuario de otro merchant devuelve `404` (no se
        revela su existencia — es la garantía de aislamiento). Solo `merchant_admin`.
        Un admin no puede degradarse ni desactivarse a sí mismo.
      parameters:
        - name: userId
          in: path
          required: true
          description: Identificador (_id) del usuario de merchant a editar.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalUserUpdateRequest'
      responses:
        '200':
          description: Usuario actualizado (sin hash).
        '400':
          description: Rol inválido o nombre vacío.
        '401':
          description: Sin token o token inválido.
        '403':
          description: Rol insuficiente o password sin cambiar.
        '404':
          description: No existe en este merchant (`user_not_found`) — incluye el caso cross-tenant.
        '409':
          description: Auto-degradación o auto-desactivación (`cannot_demote_yourself` / `cannot_deactivate_yourself`).

  /portal/transactions:
    get:
      tags: [Portal]
      summary: Listar transacciones del PROPIO merchant (solo lectura)
      operationId: portalListTransactions
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: |
        Listado paginado, scoped a la sesión (nunca de otro merchant). Lectura para
        cualquier usuario del portal. Filtros por query: `status`, `method`, `from`,
        `to` (fechas ISO), `q` (busca en paymentId / referencia).
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: method, in: query, schema: { type: string } }
        - { name: from,   in: query, schema: { type: string, format: date-time } }
        - { name: to,     in: query, schema: { type: string, format: date-time } }
        - { name: q,      in: query, schema: { type: string } }
        - { name: page,   in: query, schema: { type: integer, default: 1 } }
        - { name: limit,  in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Página de transacciones del merchant de la sesión.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  page:    { type: integer }
                  limit:   { type: integer }
                  total:   { type: integer }
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/PortalTransaction' }
        '401':
          description: Sin token o token inválido.
        '403':
          description: Password sin cambiar (`password_change_required`).

  /portal/transactions/{paymentId}:
    get:
      tags: [Portal]
      summary: Detalle de una transacción del PROPIO merchant
      operationId: portalGetTransaction
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      parameters:
        - { name: paymentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Transacción.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  transaction: { $ref: '#/components/schemas/PortalTransaction' }
        '401':
          description: Sin token o token inválido.
        '404':
          description: No existe en este merchant (`transaction_not_found`) — incluye el caso cross-tenant.

  /portal/analytics/summary:
    get:
      tags: [Portal]
      summary: KPIs del PROPIO merchant
      operationId: portalAnalyticsSummary
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: Métricas agregadas del merchant de la sesión. Importes en céntimos.
      responses:
        '200':
          description: Resumen de métricas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalAnalyticsSummary' }
        '401':
          description: Sin token o token inválido.

  /portal/billing:
    get:
      tags: [Portal]
      summary: Factura-borrador del mes actual + historial (solo merchant_admin)
      operationId: portalBilling
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: |
        Factura informativa del merchant de la sesión (M7 Fase 1 — **no se cobra
        dinero real todavía**). Solo `merchant_admin`. Importes en céntimos.
      parameters:
        - name: period
          in: query
          description: Período 'YYYY-MM'. Por defecto, el mes actual.
          schema: { type: string }
      responses:
        '200':
          description: Factura del período + historial de 6 meses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  period:  { type: string }
                  plan:    { type: string }
                  current: { $ref: '#/components/schemas/BillingBreakdown' }
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/BillingBreakdown' }
        '401': { description: Sin token o token inválido. }
        '403': { description: Rol insuficiente o password sin cambiar. }

  /portal/billing/{period}:
    get:
      tags: [Portal]
      summary: Factura-borrador de un período concreto (solo merchant_admin)
      operationId: portalBillingPeriod
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      parameters:
        - name: period
          in: path
          required: true
          description: Período 'YYYY-MM'.
          schema: { type: string }
      responses:
        '200':
          description: |
            Factura del período. Si el período está finalizado, `finalized` es true
            y `record` es la factura congelada (con nº de factura); si no, un borrador.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:   { type: boolean, const: true }
                  finalized: { type: boolean }
                  record:
                    oneOf:
                      - { $ref: '#/components/schemas/BillingBreakdown' }
                      - { $ref: '#/components/schemas/Invoice' }
        '400': { description: Período con formato inválido (`invalid_period`). }
        '401': { description: Sin token o token inválido. }
        '403': { description: Rol insuficiente o password sin cambiar. }

  /portal/invoices:
    get:
      tags: [Portal]
      summary: Facturas EMITIDAS (finalizadas) del PROPIO merchant
      operationId: portalInvoices
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: Lista las facturas ya finalizadas del merchant de la sesión (solo `merchant_admin`).
      responses:
        '200':
          description: Facturas emitidas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:  { type: boolean, const: true }
                  invoices:
                    type: array
                    items: { $ref: '#/components/schemas/Invoice' }
        '401': { description: Sin token o token inválido. }
        '403': { description: Rol insuficiente o password sin cambiar. }

  /portal/hierarchy:
    get:
      tags: [Portal]
      summary: Listar los nodos de jerarquía del PROPIO merchant
      operationId: portalListHierarchy
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: |
        Lista plana (con `parentId`) de los nodos del árbol del merchant de la
        sesión. Lectura permitida a cualquier usuario del portal. **Permisos por
        nodo (Fase 4):** si el usuario está asignado a un nodo (`hierarchyNodeId`),
        solo se devuelve su subárbol.
      responses:
        '200':
          description: Nodos del merchant de la sesión.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  nodes:
                    type: array
                    items: { $ref: '#/components/schemas/HierarchyNode' }
        '401':
          description: Sin token o token inválido.
        '403':
          description: Password sin cambiar (`password_change_required`).
    post:
      tags: [Portal]
      summary: Crear un nodo de jerarquía en el PROPIO merchant
      operationId: portalCreateHierarchyNode
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: |
        Crea un nodo en el merchant de la SESIÓN (cualquier `merchantId` del body se
        ignora). Solo `merchant_admin`. Si se indica `parentId`, el padre debe ser
        del mismo merchant y de un nivel estrictamente superior
        (globalGroup < group < branch < region < store); se permite saltar niveles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HierarchyNodeCreateRequest'
      responses:
        '201':
          description: Nodo creado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  node: { $ref: '#/components/schemas/HierarchyNode' }
        '400':
          description: Faltan campos, `nodeType` inválido o nivel de padre inválido (`invalid_parent_level`).
        '401':
          description: Sin token o token inválido.
        '403':
          description: Rol insuficiente o password sin cambiar.
        '403':
          description: Rol insuficiente, password sin cambiar, o crear fuera del subárbol asignado (`outside_your_scope`).
        '404':
          description: El `parentId` no existe en este merchant (`parent_not_found`) — incluye el caso cross-tenant.

  /portal/hierarchy/{nodeId}:
    patch:
      tags: [Portal]
      summary: Editar un nodo de jerarquía del PROPIO merchant
      operationId: portalUpdateHierarchyNode
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: |
        Edita `name`, `code`, `active` o `parentId`. Se resuelve SIEMPRE con el
        `merchantId` de sesión: un nodo de otro merchant devuelve `404`. Solo
        `merchant_admin`. Un nodo no puede ser su propio padre, y el nuevo padre
        debe ser del mismo merchant y de nivel superior.
      parameters:
        - name: nodeId
          in: path
          required: true
          description: Identificador (_id) del nodo a editar.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HierarchyNodeUpdateRequest'
      responses:
        '200':
          description: Nodo actualizado.
        '400':
          description: Nombre vacío, nivel de padre inválido o auto-referencia (`node_cannot_be_its_own_parent`).
        '401':
          description: Sin token o token inválido.
        '403':
          description: Rol insuficiente, password sin cambiar, o mover fuera del subárbol asignado (`outside_your_scope`).
        '404':
          description: No existe en este merchant o fuera de tu subárbol (`node_not_found` / `parent_not_found`).
    delete:
      tags: [Portal]
      summary: Borrar un nodo de jerarquía del PROPIO merchant
      operationId: portalDeleteHierarchyNode
      x-madurez: estable
      security: [{ PortalBearer: [] }]
      description: |
        Borra un nodo del merchant de la sesión. Solo `merchant_admin`. Se rechaza
        si el nodo tiene hijos (`409 node_has_children`): hay que borrar de abajo
        hacia arriba.
      parameters:
        - name: nodeId
          in: path
          required: true
          description: Identificador (_id) del nodo a borrar.
          schema: { type: string }
      responses:
        '200':
          description: Nodo borrado.
        '401':
          description: Sin token o token inválido.
        '403':
          description: Rol insuficiente o password sin cambiar.
        '404':
          description: No existe en este merchant o fuera de tu subárbol (`node_not_found`).
        '409':
          description: El nodo tiene hijos (`node_has_children`).

  /health:
    get:
      tags: [Observabilidad]
      summary: Healthcheck
      operationId: health
      x-madurez: estable
      security: []
      responses:
        '200':
          description: Servicio vivo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

# ════════════════════════════════════════════════════════════════════════
# WEBHOOKS SALIENTES (Monetiser → merchant)
# ════════════════════════════════════════════════════════════════════════

webhooks:

  payment.updated:
    post:
      tags: [Webhooks]
      summary: Desenlace de un pago (autorizado, rechazado, reembolsado…)
      x-madurez: estable
      x-emisor: src/services/webhookDispatcher.js
      description: |
        Se dispara cuando Paylands notifica el desenlace de un pago. Se envía al
        `callbackUrl` de la transacción (el `feedbacks.webhookUrl` del create).

        ### Firma

        Header **`Monetiser-Signature: t=<ts>, v1=<hex>`** — fíjate en el **espacio
        después de la coma**.

        ```
        v1 = HMAC_SHA256_hex( secreto, `${t}.${JSON.stringify(body)}` )
        ```

        El secreto es el `signingSecret` del merchant (o `hmacSecret` / `secret`), y
        si no tiene, el `WEBHOOK_SECRET` global. Sin ninguno de los dos, el webhook
        **no se envía** y se marca `no_secret_config`.

        Con reintentos y backoff exponencial (`WEBHOOK_MAX_RETRIES`, por defecto 6).
        Cada intento queda en la colección `webhooklogs`.

        **Desde el 17 jul 2026 esta es la firma de TODOS los webhooks salientes**
        (`payment.updated`, `payment.captured`, `payment.refunded`,
        `payment.cancelled`): un único emisor (`webhookDispatcher`), un único
        header, mismo secreto, mismos reintentos y mismo registro. La divergencia
        histórica de firmas (`x-monetiser-signature`) quedó eliminada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundWebhookPayload'
      responses:
        '200':
          description: |
            Devuelve 2xx para confirmar la recepción. Cualquier otra cosa provoca
            un reintento con backoff.

  payment.captured:
    post:
      tags: [Webhooks]
      summary: Un pago se ha capturado
      x-madurez: estable
      x-emisor: src/services/webhookDispatcher.js (vía paymentsController)
      description: |
        Misma firma, entrega, reintentos y registro que `payment.updated` — ver ese
        evento. (La divergencia histórica de firmas entre emisores se eliminó el
        17 jul 2026: todos los webhooks salientes pasan por `webhookDispatcher`.)

        `data` incluye además `capturedAmount` (entero, céntimos).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundWebhookPayload'
      responses:
        '200':
          description: |
            Devuelve 2xx para confirmar la recepción. Cualquier otra cosa provoca
            un reintento con backoff.

  payment.refunded:
    post:
      tags: [Webhooks]
      summary: Un pago se ha reembolsado
      x-madurez: estable
      x-emisor: src/services/webhookDispatcher.js (vía paymentsController)
      description: |
        Misma firma, entrega, reintentos y registro que `payment.updated` — ver ese evento.

        `data` incluye además `refundedAmount` (entero, céntimos).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundWebhookPayload'
      responses:
        '200':
          description: |
            Devuelve 2xx para confirmar la recepción. Cualquier otra cosa provoca
            un reintento con backoff.

  payment.cancelled:
    post:
      tags: [Webhooks]
      summary: Un pago se ha anulado
      x-madurez: estable
      x-emisor: src/services/webhookDispatcher.js (vía paymentsController)
      description: |
        Misma firma, entrega, reintentos y registro que `payment.updated` — ver ese evento.

        `data` incluye además `cancelled: true`.

        Grafía: evento, flag y `data.status` usan ya todos `cancelled` (dos `l`),
        la grafía de Paylands. El evento se llamó `payment.canceled` (una `l`)
        hasta el 17 jul 2026, cuando se alineó junto con la unificación de los
        emisores de webhook. No había merchants integrados verificando eventos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundWebhookPayload'
      responses:
        '200':
          description: |
            Devuelve 2xx para confirmar la recepción. Cualquier otra cosa provoca
            un reintento con backoff.

# ════════════════════════════════════════════════════════════════════════
# COMPONENTS
# ════════════════════════════════════════════════════════════════════════

components:

  securitySchemes:

    ApiKeySimple:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Modo simple, pensado para Postman y pruebas.

        **Solo funciona si `API_KEY_SIMPLE_FALLBACK=true` en el entorno.** Si no lo
        está, hay que usar `HmacV1`.

        > **Cuidado con qué va en este header.** Hoy `x-api-key` lleva el
        > **`rawKeyId`** (`mk_...`), no el `rawSecret` (`ms_...`). Verificado en
        > `validateApiKey()` de `src/services/apiKeyService.js`: busca por
        > `keyId: rawKey`. El `rawSecret` no interviene en este modo.
        >
        > Es decir: **en modo simple el secreto no se usa, y el identificador actúa
        > como credencial.** Aceptable para pruebas; no para producción. Ese es el
        > motivo por el que existe `HmacV1`.

        Requiere acompañarlo del header `x-merchant-id`.

    MerchantId:
      type: apiKey
      in: header
      name: x-merchant-id
      description: |
        Merchant sobre el que se opera.

        En las rutas `/{merchantId}/...` se puede omitir: se toma de la URL. En las
        de ciclo de vida (`/payments/{paymentId}/...`) **es obligatorio**, porque el
        merchant no viaja en la ruta.

        Orden de resolución real (`hmacAuth.js`): `req.params.merchantId` →
        header `x-merchant-id` → `req.body.merchantId`.

    HmacV1:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Modo canónico (estilo Worldline GCS). Formato del header:

        ```
        Authorization: GCS v1HMAC:<keyId>:<firmaBase64>
        ```

        ### Cadena que se firma

        Cinco líneas unidas por `\n`, en este orden exacto:

        ```
        <MÉTODO EN MAYÚSCULAS>
        <Content-Type sin parámetros>
        <valor del header Date>
        <headers canónicos>
        <recurso canónico>
        ```

        - **Headers canónicos**: solo los que empiezan por `x-monetiser-` o `x-gcs-`,
          en minúsculas, ordenados alfabéticamente, como `clave:valor` unidos por
          `\n`. Si no hay ninguno, línea vacía.
        - **Recurso canónico**: la ruta **incluyendo el query string**
          (`req.originalUrl` tal cual).
        - El `Date` es obligatorio, en formato RFC 7231, y debe caer dentro de
          ±`HMAC_DATE_TOLERANCE_MINUTES` (por defecto 5 minutos).

        ### La clave HMAC no es el secreto

        > La firma se calcula con **`secretHash`** (el SHA-256 del secreto guardado
        > en Mongo) como clave HMAC, **no con el `rawSecret`**. Verificado en
        > `hmacAuth.js`: `computeSignature(doc.secretHash, stringToHash)`. Quien
        > integre debe hashear su secreto con SHA-256 primero y usar ese valor como
        > clave.

        Firma en base64. Comparación timing-safe.

        > Aviso conocido: en Postman, `crypto.subtle` es asíncrono y no bloquea el
        > envío de la petición — la firma sale vacía. Usar CryptoJS síncrono.

    AdminToken:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: |
        Token de administración (`ADMIN_TOKEN` del entorno). Da acceso a la gestión
        de merchants, API keys y reglas de routing de **todos** los merchants.

    PortalBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Sesión del **portal del merchant** (M6). JWT firmado con `PORTAL_JWT_SECRET`
        y `audience: portal`, obtenido en `POST /portal/auth/login`. Se envía como
        `Authorization: Bearer <token>`.

        **Plano separado del backoffice interno.** Un token de backoffice NO se
        acepta aquí (no lleva `aud: portal`), y un token de portal NO se acepta en
        el backoffice (secretos distintos: `PORTAL_JWT_SECRET` ≠
        `BACKOFFICE_JWT_SECRET`, requisito de configuración). El `merchantId` va
        dentro del token: todo el aislamiento se resuelve por la sesión, nunca por
        un `merchantId` del cliente.

        Mientras el usuario arrastre `mustChangePassword` (password temporal del
        alta), el portal responde `403 password_change_required` a todo salvo
        `POST /portal/auth/change-password`.

  parameters:

    MerchantIdPath:
      name: merchantId
      in: path
      required: true
      description: Identificador del merchant (ej. `demo-merchant`).
      schema: { type: string }

    PaymentIdPath:
      name: paymentId
      in: path
      required: true
      description: El `paymentId` (UUID v4) devuelto al crear el pago.
      schema: { type: string, format: uuid }

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        **Obligatoria** en capture, refund y cancel. Sin ella: `400 Missing
        Idempotency-Key header`.

        Formato exigido: `^[a-zA-Z0-9-]{8,64}$` (alfanumérico y guiones, 8 a 64
        caracteres). Un UUID vale. Otro formato: `400 Invalid Idempotency-Key format`.

        Repetir la misma clave sobre el mismo pago y la misma operación **rejuega la
        respuesta original** (mismo código y mismo cuerpo), sin volver a llamar a
        Paylands.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9-]{8,64}$'
      example: cnl-final-001

  responses:

    Unauthorized:
      description: Credenciales ausentes o inválidas.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: false }
              error: { type: string, const: unauthorized }
              message: { type: string }
              detail:
                type: string
                description: |
                  Motivo exacto. Valores reales: `missing_merchant_id`,
                  `missing_or_invalid_authorization_header`, `invalid_api_key_simple`,
                  `malformed_authorization_header`, `empty_key_id_or_signature`,
                  `missing_date_header`, `invalid_date_header`,
                  `date_out_of_tolerance_window`, `key_not_found`, `invalid_signature`.

    UnauthorizedAdmin:
      description: Falta el header `X-Admin-Token` o no es válido.

    BadIdempotencyKey:
      description: |
        Falta la `Idempotency-Key` o su formato no cumple `^[a-zA-Z0-9-]{8,64}$`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

    ProcessorDeclined:
      description: |
        Paylands rechazó la operación. La transacción NO cambia de estado.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: false }
              message: { type: string, const: processor_declined }

    FeatureDisabled:
      description: |
        Función desactivada por feature flag — **no es un error de tu petición**.
        Falta poner el flag correspondiente a `1` en el entorno.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: false }
              error: { type: string, const: disabled }

  schemas:

    AmountOfMoney:
      type: object
      required: [amount, currencyCode]
      description: Importe. **Siempre en céntimos.**
      properties:
        amount:
          type: integer
          description: '**Céntimos.** `100` = 1,00 €.'
          example: 100
        currencyCode:
          type: string
          minLength: 3
          maxLength: 3
          example: EUR
      additionalProperties: false

    HostedCheckoutRequest:
      type: object
      required: [order]
      description: |
        `HostedCheckoutRequestDTO` en `src/dtos/hostedCheckoutDTO.js`.
        **No enviar datos de tarjeta aquí** — se capturan en el iFrame.
      properties:
        order:
          type: object
          required: [amountOfMoney]
          properties:
            amountOfMoney: { $ref: '#/components/schemas/AmountOfMoney' }
            references:
              type: object
              properties:
                merchantReference:
                  type: string
                  description: Tu referencia de pedido. Aparece en la conciliación.
              additionalProperties: true
            customer:
              type: object
              additionalProperties: true
            shipping:
              type: object
              additionalProperties: true
            shoppingCart:
              type: object
              additionalProperties: true
            totalTaxAmount: { type: number }
        feedbacks:
          type: object
          description: A dónde vuelve el usuario y a dónde se notifica el resultado.
          properties:
            returnUrl:
              type: string
              description: URL a la que vuelve el cardholder al terminar.
            webhookUrl:
              type: string
              format: uri
              description: |
                Destino de los webhooks salientes. **Se persiste como `callbackUrl`
                en la transacción.** Sin esto no hay notificación.
            webhooksUrls:
              type: array
              items: { type: string, format: uri }
          additionalProperties: false
        cardPaymentMethodSpecificInput:
          type: object
          description: |
            Opcional y **no recomendado** en este flujo: los datos de tarjeta se
            capturan en el iFrame. `card` se acepta por compatibilidad del DTO.
          properties:
            token: { type: string }
            tokenize: { type: boolean }
            returnUrl: { type: string }
            paymentProductId: { type: integer }
            skipAuthentication: { type: boolean }
            card: { $ref: '#/components/schemas/Card' }
          additionalProperties: true
        fraudFields:
          type: object
          properties:
            customerIpAddress: { type: string }
            blackListData: { type: string }
            productCategories:
              type: array
              items: { type: string }
      additionalProperties: false

    HostedCheckoutCreateResponse:
      type: object
      description: '`buildHostedCheckoutCreateResponse` en `hostedCheckoutDTO.js`.'
      properties:
        success: { type: boolean }
        paymentId:
          type: string
          description: Identificador del pago. **Es el que se usa en capture/refund/cancel.**
        hostedCheckoutId:
          type: string
          description: Identificador del checkout. Se usa en el endpoint de status.
        merchantId: { type: string }
        merchantReference: { type: string }
        amount:
          type: integer
          description: Céntimos.
        currency: { type: string }
        RETURNMAC: { type: string }
        partialRedirectUrl: { type: string }
        redirectUrl:
          type: string
          format: uri
          description: |
            **Lo que hay que embeber en un `<iframe>`.** Lleva al cardholder al
            formulario de pago.
        session:
          type: object
          additionalProperties: true
        timestamp: { type: string, format: date-time }

    HostedCheckoutStatusResponse:
      type: object
      description: '`buildHostedCheckoutStatusResponse` en `hostedCheckoutDTO.js`.'
      properties:
        success: { type: boolean }
        hostedCheckoutId: { type: string }
        paymentId: { type: string }
        merchantId: { type: string }
        amount: { type: integer, description: Céntimos. }
        currency: { type: string }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        statusOutput:
          type: object
          nullable: true
          additionalProperties: true
        completed: { type: boolean, nullable: true }
        expired: { type: boolean, nullable: true }
        sessionExpiresAt: { type: string, format: date-time, nullable: true }
        timestamp: { type: string, format: date-time }

    TransactionStatus:
      type: string
      description: |
        Estado de la transacción en Monetiser.

        > **No es un enum cerrado.** En `src/models/Transaction.js` el campo es
        > `status: { type: String, required: true }`, **sin `enum`**: Mongoose no
        > restringe el valor. Esta lista es la de los valores que el código asigna
        > hoy (verificados uno a uno), no una garantía del contrato. Un adquirente
        > con un estado no contemplado en `STATUS_MAP` cae a `pending`.

        > **Anulaciones: `cancelled`, con dos `l`.** Es la grafía de Paylands
        > (endpoint `POST /payment/cancellation`, status de webhook `CANCELLED`), y
        > desde el 16 jul 2026 la única que escribe Monetiser.
        >
        > `canceled` (una `l`) fue un bug: `POST /payments/{id}/cancel` lo persistía
        > así y pisaba el `cancelled` del webhook, con lo que
        > `hostedCheckoutController.js:260` —que decide `completed` comprobando
        > `['approved','authorized','declined','refused','cancelled']`— nunca casaba
        > y el pago quedaba en `completed: false` para siempre. Corregido.
        > **Puede quedar `canceled` en transacciones de prueba anteriores a esa
        > fecha**; no se migraron. Ver DEV-LOG sección 5.
      examples: [hosted_pending, authorized, cancelled]
      enum:
        - initialized
        - hosted_pending
        - pending
        - pending_3ds
        - authorized
        - captured
        - partially_captured
        - cancelled
        - refunded
        - partially_refunded
        - declined
        - error

    Card:
      type: object
      description: |
        `CardDTO` en `src/dtos/paymentNodeDTOs.js`. Nodo estructural compartido.

        > **S2S NO lo acepta (tokens-only, v2.1.0):** si llega `cardNumber` o `cvv`
        > en crudo, `POST /{merchantId}/payments/server` responde
        > `400 card_data_not_accepted`. En Hosted Checkout la tarjeta tampoco se
        > envía aquí: se captura en ProxyFields y nunca llega a Monetiser.
      properties:
        cardholderName: { type: string }
        cardNumber:
          type: string
          description: 'PAN en crudo. **Rechazado por S2S** (SAQ A) — ver el endpoint S2S.'
        expiryDate:
          type: number
          description: 'Numérico en el DTO, no string. Ej: `1234` para 12/34.'
        cvv: { type: string }
      additionalProperties: false

    ServerPaymentRequest:
      type: object
      description: |
        **BETA — tokens-only.** `serverPaymentDTO.js`. Envía el `source_uuid` de
        ProxyFields, nunca el PAN. El token se acepta en el campo raíz `source_uuid`
        o en `cardPaymentMethodSpecificInput.token` (equivalentes). `card.cardNumber`
        y `card.cvv` en crudo se rechazan con `400 card_data_not_accepted`.
      properties:
        source_uuid:
          type: string
          description: |
            Token de ProxyFields (Paylands `source_uuid`). Alternativa equivalente a
            `cardPaymentMethodSpecificInput.token`. Uno de los dos es obligatorio.
        order:
          type: object
          required: [amountOfMoney]
          properties:
            amountOfMoney: { $ref: '#/components/schemas/AmountOfMoney' }
            references:
              type: object
              additionalProperties: true
          additionalProperties: true
        cardPaymentMethodSpecificInput:
          type: object
          properties:
            card:
              allOf:
                - $ref: '#/components/schemas/Card'
              description: 'No usar en S2S: `cardNumber`/`cvv` se rechazan (SAQ A).'
            token:
              type: string
              description: 'Token de ProxyFields (source_uuid). Alternativa al campo raíz `source_uuid`.'
            paymentProductId: { type: integer }
            threeDSecure:
              type: object
              description: 'Requerido por el DTO. Lleva `redirectionData.returnUrl`.'
              additionalProperties: true
          additionalProperties: true
        feedbacks:
          type: object
          additionalProperties: true
      additionalProperties: true

    CaptureRequest:
      type: object
      description: |
        `captureSchema` en `src/validators/paymentValidator.js`.

        > **Inconsistencia real:** aquí el importe es `amount` **plano**, mientras
        > que en refund y cancel es `amountOfMoney.amount`. No es un error de esta
        > spec: es así en el código. Rechaza campos desconocidos.
      properties:
        amount:
          type: integer
          minimum: 1
          description: |
            **Céntimos.** Si se omite, se captura el importe pendiente completo.
        isFinal:
          type: boolean
          description: Marca esta captura como la última de la autorización.
        references:
          type: object
          properties:
            merchantReference: { type: string }
            merchantParameters: { type: string }
            operationGroupReference: { type: string }
          additionalProperties: false
        operationReferences:
          type: object
          properties:
            merchantReference: { type: string }
            operationGroupReference: { type: string }
          additionalProperties: false
      additionalProperties: false

    RefundRequest:
      type: object
      description: |
        `refundSchema` en `src/validators/paymentValidator.js`.
        Rechaza campos desconocidos.
      properties:
        amountOfMoney:
          type: object
          required: [amount]
          description: Si se omite, se reembolsa el importe reembolsable restante.
          properties:
            amount:
              type: integer
              minimum: 1
              description: '**Céntimos.**'
            currencyCode:
              type: string
              minLength: 3
              maxLength: 3
              description: Opcional aquí. Se normaliza a mayúsculas.
          additionalProperties: false
        reason: { type: string }
        references:
          type: object
          properties:
            merchantReference: { type: string }
            merchantParameters: { type: string }
            operationGroupReference: { type: string }
          additionalProperties: false
        operationReferences:
          type: object
          properties:
            merchantReference: { type: string }
            operationGroupReference: { type: string }
          additionalProperties: false
        omnichannelRefundSpecificInput:
          type: object
          properties:
            operatorId: { type: string }
          additionalProperties: false
      additionalProperties: false

    CancelRequest:
      type: object
      description: |
        `cancelSchema` en `src/validators/paymentValidator.js`.
        Rechaza campos desconocidos. Lo verificado es el body vacío.
      properties:
        amountOfMoney:
          type: object
          properties:
            amount: { type: integer, minimum: 1, description: '**Céntimos.**' }
            currencyCode: { type: string, minLength: 3, maxLength: 3 }
          additionalProperties: false
        isFinal: { type: boolean }
        operationReferences:
          type: object
          properties:
            merchantReference: { type: string }
            operationGroupReference: { type: string }
          additionalProperties: false
      additionalProperties: false

    CaptureResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        paymentId: { type: string }
        capturedAmount: { type: integer, description: Céntimos capturados en ESTA operación. }
        currency: { type: string }

    RefundResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        paymentId: { type: string }
        refundedAmount: { type: integer, description: Céntimos reembolsados en ESTA operación. }
        currency: { type: string }

    CancelResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        status:
          type: string
          description: |
            `cancelled` (dos `l`, grafía de Paylands). Es también lo que queda
            persistido en la transacción. Antes del 16 jul 2026 devolvía `canceled`.
          example: cancelled
        paymentId: { type: string }

    PaylandsWebhookBody:
      type: object
      description: |
        Lo que envía Paylands. Los campos que Monetiser realmente lee están
        documentados aquí; Paylands puede mandar más.
      properties:
        validation_hash:
          type: string
          description: SHA-256 hex. Ver el detalle del cálculo en el endpoint.
        order:
          type: object
          description: Entra en el cálculo del hash.
          properties:
            uuid:
              type: string
              description: |
                **El `orderUuid`.** Está en `order.uuid`, **no** en `order_uuid` a
                nivel raíz — confundirlos costó una sesión de depuración.
            status:
              type: string
              description: |
                Estado de Paylands. Mapeo a Monetiser (case-insensitive):
                `SUCCESS`/`PAID`/`CONFIRMED`/`PENDING_CONFIRMATION` → `authorized`;
                `REFUSED`/`ERROR`/`EXPIRED`/`FRAUD`/`BLACKLISTED` → `declined`;
                `CANCELLED`/`USER_CANCELLED` → `cancelled`;
                `PENDING` → `pending`; `REFUNDED` → `refunded`;
                `PARTIALLY_REFUNDED` → `partially_refunded`.

                Un estado no contemplado cae a `pending` y se registra
                `wasUnmapped: true` en los logs.

                `PENDING_CONFIRMATION` significa "orden DEFERRED autorizada, saldo
                retenido" — por eso mapea a `authorized`.
          additionalProperties: true
        client:
          type: object
          description: Entra en el cálculo del hash.
          additionalProperties: true
        extra_data:
          description: |
            Entra en el hash **solo si viene en el body**. Si no viene, NO debe
            incluirse como `null` en el objeto a hashear.
          additionalProperties: true
      additionalProperties: true

    OutboundWebhookPayload:
      type: object
      required: [event, version, data]
      description: Cuerpo de los webhooks que Monetiser envía al merchant.
      properties:
        event:
          type: string
          enum: [payment.updated, payment.captured, payment.refunded, payment.cancelled]
        version: { type: string, const: v1 }
        data:
          type: object
          required: [paymentId, merchantId, status, amount, currency, timestamp]
          properties:
            paymentId: { type: string }
            merchantId: { type: string }
            status: { $ref: '#/components/schemas/TransactionStatus' }
            amount: { type: integer, description: '**Céntimos.**' }
            currency: { type: string }
            connectorUsed:
              type: string
              nullable: true
              description: 'Conector que procesó el pago. `unknown` si no consta.'
            reasonCode: { type: string, nullable: true }
            timestamp: { type: string, format: date-time }
            cardInfo:
              type: object
              nullable: true
              description: 'Solo metadatos. **Nunca el PAN.**'
              properties:
                bin: { type: string, nullable: true }
                cardBrand: { type: string, nullable: true }
                cardType: { type: string, nullable: true }
                issuerCountry: { type: string, nullable: true }
            capturedAmount:
              type: integer
              description: Solo en `payment.captured`. Céntimos.
            refundedAmount:
              type: integer
              description: Solo en `payment.refunded`. Céntimos.
            cancelled:
              type: boolean
              description: Solo en `payment.cancelled`.

    ApiKeyCreateResponse:
      type: object
      description: |
        **El `rawSecret` solo se ve aquí, esta única vez.**
      properties:
        success: { type: boolean }
        rawKeyId:
          type: string
          description: 'Identificador (`mk_...`). Es lo que hoy va en `x-api-key`.'
          example: mk_7065b5507c6efae4d1067f2768919154
        rawSecret:
          type: string
          description: |
            Secreto (`ms_...`). **No se puede recuperar después.** Se usa para
            calcular la firma HMAC (hasheado con SHA-256 antes — ver `HmacV1`).
        keyId: { type: string }
        label: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }

    MerchantCreateRequest:
      type: object
      required: [merchantId, name, country]
      properties:
        merchantId:
          type: string
          description: Único. Es el que viaja en las URLs y en `x-merchant-id`.
        name: { type: string }
        country: { type: string, description: 'ISO 3166-1 alpha-2 (ej. `ES`).' }
        plan:
          type: string
          enum: [free, starter, growth, enterprise]
        status:
          type: string
          enum: [active, suspended, pending]
        webhookUrl:
          type: string
          format: uri
          description: Webhook por defecto del merchant.
        signingSecret:
          type: string
          description: |
            Secreto con el que se firman sus webhooks salientes. **Nunca se devuelve
            en las respuestas.**

            Ojo: solo lo usa el dispatcher (`payment.updated`). Los eventos de ciclo
            de vida se firman con `WEBHOOK_SECRET` global — ver `payment.captured`.
        serviceUuid:
          type: string
          description: 'UUID del servicio en Paylands. Va al campo `service` de POST /payment.'
        templateUuid:
          type: string
          description: 'Plantilla de la carta de pago. Va a `template_uuid`.'
        branding:
          type: object
          properties:
            logoUrl: { type: string, format: uri }
            brandColor: { type: string }
            name: { type: string }

    MerchantPatchRequest:
      type: object
      description: Campos actualizables. Todos opcionales.
      properties:
        name: { type: string }
        country: { type: string }
        plan: { type: string, enum: [free, starter, growth, enterprise] }
        status: { type: string, enum: [active, suspended, pending] }
        webhookUrl: { type: string, format: uri }
        serviceUuid: { type: string }
        templateUuid: { type: string }
        branding:
          type: object
          additionalProperties: true

    Policy:
      type: object
      required: [merchantId, version, defaultConnector, rules]
      description: Política de routing de un merchant.
      properties:
        merchantId: { type: string }
        version: { type: string, enum: [v1] }
        defaultConnector:
          type: string
          description: |
            Conector por defecto si ninguna regla casa. **Por defecto `dummyCard`**
            (el conector simulado) en merchants sin política propia.
          example: dummyCard
        rules:
          type: array
          items:
            type: object
            required: [id, when, action]
            properties:
              id: { type: string }
              priority: { type: integer }
              when:
                type: object
                description: |
                  Condiciones. El motor evalúa: amount, currency, BIN,
                  issuerCountry, scheme, cardType, method.
                additionalProperties: true
              action:
                type: object
                properties:
                  route:
                    type: string
                    description: Conector al que enrutar.

    RuleDecision:
      type: object
      properties:
        connector: { type: string }
        matchedRuleId: { type: string, nullable: true }
        reasons:
          type: array
          items: { type: string }
        explain:
          type: array
          items:
            type: object
            additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, const: false }
        message: { type: string }
        error: { type: string }

    # ── Portal del merchant (M6) ──────────────────────────────────────────
    MerchantUserPublic:
      type: object
      description: Proyección pública de un usuario de merchant (nunca incluye el passwordHash).
      properties:
        _id:                { type: string }
        merchantId:         { type: string }
        email:              { type: string, format: email }
        name:               { type: string }
        role:
          type: string
          enum: [merchant_admin, merchant_operator, merchant_viewer]
        active:             { type: boolean }
        mustChangePassword: { type: boolean }
        hierarchyNodeId:    { type: string, nullable: true, description: Nodo de jerarquía al que está restringido (Fase 4); null = ve todo su merchant. }
        lastLoginAt:        { type: string, format: date-time, nullable: true }
        createdAt:          { type: string, format: date-time }

    PortalLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string }

    PortalLoginResponse:
      type: object
      properties:
        success:            { type: boolean, const: true }
        token:              { type: string, description: JWT de portal (aud portal). }
        mustChangePassword: { type: boolean }
        user:
          type: object
          properties:
            email:      { type: string, format: email }
            name:       { type: string }
            role:       { type: string }
            merchantId: { type: string }

    PortalChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword:     { type: string, minLength: 8, description: Distinta de la actual. }

    PortalUserCreateRequest:
      type: object
      required: [name, email, role]
      description: |
        `merchantId` NO se acepta aquí — se toma siempre de la sesión. Si se envía,
        se ignora.
      properties:
        name:  { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [merchant_admin, merchant_operator, merchant_viewer]

    PortalUserUpdateRequest:
      type: object
      description: Todos los campos son opcionales; se aplican los presentes.
      properties:
        name: { type: string }
        role:
          type: string
          enum: [merchant_admin, merchant_operator, merchant_viewer]
        active: { type: boolean }
        hierarchyNodeId:
          type: string
          nullable: true
          description: |
            (Fase 4) Asigna el usuario a un nodo de jerarquía del PROPIO merchant
            (debe existir; si no, `400 invalid_hierarchy_node`). null lo desasigna.

    PortalUserCreateResponse:
      type: object
      properties:
        success:      { type: boolean, const: true }
        message:      { type: string }
        tempPassword: { type: string, description: 'Password temporal; visible una sola vez.' }
        user:         { $ref: '#/components/schemas/MerchantUserPublic' }

    # ── Jerarquía de tiendas (M6 Fase 2) ──────────────────────────────────
    HierarchyNode:
      type: object
      description: Nodo del árbol de jerarquía de un merchant.
      properties:
        _id:        { type: string }
        merchantId: { type: string, description: Tenant dueño (sale de la sesión). }
        nodeType:
          type: string
          enum: [globalGroup, group, branch, region, store]
        name:       { type: string }
        code:       { type: string, nullable: true, description: Código propio del merchant para el nodo. }
        parentId:   { type: string, nullable: true, description: Nodo padre; null si es raíz. }
        active:     { type: boolean }
        createdAt:  { type: string, format: date-time }

    HierarchyNodeCreateRequest:
      type: object
      required: [nodeType, name]
      description: |
        `merchantId` NO se acepta aquí — se toma de la sesión. Si se envía, se ignora.
      properties:
        nodeType:
          type: string
          enum: [globalGroup, group, branch, region, store]
        name:     { type: string }
        code:     { type: string, nullable: true }
        parentId: { type: string, nullable: true, description: 'Padre (mismo merchant, nivel superior); omitir o null para raíz.' }

    HierarchyNodeUpdateRequest:
      type: object
      description: Todos los campos son opcionales; se aplican los presentes.
      properties:
        name:     { type: string }
        code:     { type: string, nullable: true }
        active:   { type: boolean }
        parentId: { type: string, nullable: true, description: 'Nuevo padre (mismo merchant, nivel superior); null para hacerlo raíz.' }

    # ── Datos del portal (M6 Fase 3) ──────────────────────────────────────
    PortalTransaction:
      type: object
      description: Proyección de una transacción para el portal (solo campos no sensibles).
      properties:
        paymentId:         { type: string }
        merchantId:        { type: string }
        amount:            { type: integer, description: Importe en céntimos. }
        currency:          { type: string }
        status:            { type: string }
        method:            { type: string }
        processor:         { type: string, nullable: true }
        cardBrand:         { type: string, nullable: true }
        issuerCountry:     { type: string, nullable: true }
        merchantReference: { type: string, nullable: true }
        createdAt:         { type: string, format: date-time }

    PortalAnalyticsSummary:
      type: object
      description: KPIs del merchant de la sesión. Importes en céntimos.
      properties:
        success:              { type: boolean, const: true }
        totalTransactions:    { type: integer }
        approvedTransactions: { type: integer }
        declinedTransactions: { type: integer }
        approvalRate:         { type: number, description: Porcentaje 0–100. }
        totalVolume:          { type: integer, description: Volumen aprobado en céntimos. }
        averageTicket:        { type: integer, description: Ticket medio aprobado en céntimos. }

    # ── Facturación (M7 Fase 1) ───────────────────────────────────────────
    BillingBreakdown:
      type: object
      description: |
        Factura-borrador de un merchant para un período. Importes en CÉNTIMOS.
        En Fase 1 es informativa (no se cobra dinero real).
      properties:
        merchantId:        { type: string }
        period:            { type: string, description: "'YYYY-MM'." }
        plan:              { type: string }
        currency:          { type: string }
        transactionsCount: { type: integer, description: Total de transacciones del período. }
        billableCount:     { type: integer, description: Transacciones facturables (approved/authorized/captured). }
        billableVolume:    { type: integer, description: Volumen facturable en céntimos. }
        subscriptionFee:   { type: integer, description: Cuota del plan (céntimos). }
        usageFee:          { type: integer, description: Fee por transacción × facturables (céntimos). }
        volumeFee:         { type: integer, description: Fee por volumen (céntimos). }
        totalDue:          { type: integer, description: Total a pagar (céntimos). }

    Invoice:
      type: object
      description: |
        Factura EMITIDA (finalizada) — M7 Fase 2. Congelada e inmutable: mismas
        cifras que BillingBreakdown más el nº de factura, estado y snapshot de
        precios aplicado. Importes en CÉNTIMOS.
      properties:
        merchantId:        { type: string }
        period:            { type: string, description: "'YYYY-MM'." }
        invoiceNumber:     { type: string, description: "Ej. 'INV-2026-05-demo-merchant'." }
        plan:              { type: string }
        currency:          { type: string }
        status:            { type: string, enum: [finalized, paid] }
        pricingSnapshot:
          type: object
          properties:
            monthlyBase:       { type: integer }
            perTransactionFee: { type: integer }
            volumeBps:         { type: integer }
        transactionsCount: { type: integer }
        billableCount:     { type: integer }
        billableVolume:    { type: integer }
        subscriptionFee:   { type: integer }
        usageFee:          { type: integer }
        volumeFee:         { type: integer }
        totalDue:          { type: integer }
        finalizedAt:       { type: string, format: date-time }
        finalizedBy:       { type: string, nullable: true }
