<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado de Monetiser</title>
  <link rel="icon" href="/Logo_Monetiser.png">
  <style>
    :root { --ok:#1f8a4c; --warn:#b7791f; --bad:#c53030; --muted:#666; --bg:#f7f8fa; --card:#fff; --border:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:#111; }
    main { max-width:720px; margin:0 auto; padding:32px 16px; }
    h1 { font-size:22px; margin:0 0 4px; display:flex; align-items:center; gap:10px; }
    h1 img { width:32px; height:32px; border-radius:6px; }
    .env { font-size:13px; color:var(--muted); margin-bottom:24px; }
    .banner { padding:16px; border-radius:10px; color:#fff; font-weight:600; margin-bottom:20px; }
    .banner.operational { background:var(--ok); } .banner.degraded { background:var(--warn); } .banner.major_outage, .banner.unknown { background:var(--bad); }
    .card { background:var(--card); border:1px solid var(--border); border-radius:10px; }
    .row { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--border); gap:12px; }
    .row:last-child { border-bottom:none; }
    .state { font-size:13px; font-weight:600; white-space:nowrap; }
    .state.operational { color:var(--ok); } .state.degraded, .state.delayed, .state.recovering { color:var(--warn); } .state.major_outage, .state.unknown { color:var(--bad); }
    .foot { font-size:12px; color:var(--muted); margin-top:16px; }
  </style>
</head>
<body>
  <main>
    <h1><img src="/Logo_Monetiser.png" alt="">Estado de Monetiser</h1>
    <div class="env" id="env">Cargando…</div>
    <div class="banner unknown" id="banner">Comprobando…</div>
    <div class="card" id="components"></div>
    <div class="foot" id="foot"></div>
  </main>
  <script src="/status.js"></script>
</body>
</html>
