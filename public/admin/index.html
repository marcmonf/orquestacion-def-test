<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Monetiser · Reglas por Merchant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100">
  <div class="max-w-7xl mx-auto p-6">
    <header class="mb-6 flex items-center justify-between">
      <h1 class="text-2xl font-semibold">Panel de Reglas · Monetiser</h1>
      <nav class="flex gap-4 text-sm">
        <a href="/health" target="_blank" class="underline">/health</a>
        <span>·</span>
        <a href="/admin" class="underline">/admin</a>
      </nav>
    </header>

    <!-- Barra de control -->
    <section class="grid grid-cols-1 md:grid-cols-6 gap-4 mb-6">
      <div class="col-span-1">
        <label class="text-sm">Merchant ID</label>
        <input id="merchantId" class="w-full mt-1 rounded-md bg-slate-900 border border-slate-700 p-2" placeholder="demo-merchant" />
      </div>
      <div class="col-span-1">
        <label class="text-sm">Admin Token</label>
        <input id="adminToken" class="w-full mt-1 rounded-md bg-slate-900 border border-slate-700 p-2" placeholder="X-Admin-Token" />
      </div>
      <div class="col-span-1">
        <label class="text-sm">Default Connector</label>
        <input id="defaultConnector" class="w-full mt-1 rounded-md bg-slate-900 border border-slate-700 p-2" placeholder="dummyCard" />
      </div>
      <div class="col-span-3 flex items-end gap-2">
        <button id="btnLoad" class="px-4 py-2 bg-blue-600 rounded-lg hover:bg-blue-500">Cargar</button>
        <button id="btnSave" class="px-4 py-2 bg-emerald-600 rounded-lg hover:bg-emerald-500">Guardar</button>
        <button id="btnTry" class="px-4 py-2 bg-indigo-600 rounded-lg hover:bg-indigo-500">Probar</button>
        <button id="btnExport" class="px-4 py-2 bg-slate-700 rounded-lg hover:bg-slate-600">Exportar</button>
        <label class="px-4 py-2 bg-slate-700 rounded-lg hover:bg-slate-600 cursor-pointer">
          Importar <input id="fileImport" type="file" accept="application/json" class="hidden">
        </label>
        <button id="btnAudit" class="px-4 py-2 bg-amber-600 rounded-lg hover:bg-amber-500">Histórico</button>
      </div>
    </section>

    <!-- Atajos -->
    <section class="mb-4">
      <h2 class="text-lg font-medium mb-2">Atajos de regla</h2>
      <div class="flex flex-wrap gap-2">
        <button data-preset="eurSmall" class="px-3 py-1 bg-slate-800 rounded">EUR &lt; 50 → dummyCard</button>
        <button data-preset="binES" class="px-3 py-1 bg-slate-800 rounded">BIN ES (4571, 4029) → dummyCard</button>
        <button data-preset="issuerBR" class="px-3 py-1 bg-slate-800 rounded">Issuer BR → dummyCard</button>
        <button data-preset="schemeVisa" class="px-3 py-1 bg-slate-800 rounded">Visa → dummyCard</button>
        <button data-preset="lowLatency" class="px-3 py-1 bg-slate-800 rounded">latencyMs &lt; 150 → dummyCard</button>
      </div>
    </section>

    <!-- Editor JSON -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div>
        <h2 class="text-lg font-medium mb-2">Política (JSON)</h2>
        <textarea id="policy" class="w-full h-96 p-3 rounded-md bg-slate-900 border border-slate-700 font-mono text-sm"></textarea>
        <div id="status" class="mt-3 text-sm"></div>
      </div>
      <div>
        <h2 class="text-lg font-medium mb-2">Resultado de prueba</h2>
        <div class="grid grid-cols-2 gap-3 mb-2">
          <input id="sampleAmount" class="rounded-md bg-slate-900 border border-slate-700 p-2" placeholder="amount 25" />
          <input id="sampleCurrency" class="rounded-md bg-slate-900 border border-slate-700 p-2" placeholder="currency EUR" />
          <input id="sampleCard" class="rounded-md bg-slate-900 border border-slate-700 p-2 col-span-2" placeholder="cardNumber 4111111111111111 (opcional)" />
        </div>
        <div id="tryOut" class="min-h-40 rounded-md border border-slate-700 p-3 bg-slate-900 text-sm"></div>
        <div id="auditOut" class="mt-6 hidden">
          <h3 class="font-medium mb-2">Histórico de cambios</h3>
          <div id="auditTable" class="text-xs space-y-2"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
