<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado del pago</title>
  <!--
    Página de resultado del checkout. La sirve src/routes/checkoutResult.js, que
    añade al final de la cabecera un bloque JSON (id monetiser-runtime) con los
    datos del pago. Sin ese bloque (abierta a mano) enseña "Enlace no válido".
    Toda la lógica está en /checkout-result.js (ruta ABSOLUTA: esta página se
    sirve en /checkout/result/ID, sin barra final, y una ruta relativa apuntaría
    a otro sitio). No escribir etiquetas HTML literales en este comentario: el
    servidor busca el cierre de la cabecera para insertar los datos.
  -->
  <style>
    :root {
      --brand: #0070f3;
      --ok: #1f9d55;
      --ko: #d64545;
      --text: #111;
      --muted: #666;
      --line: #eee;
      --bg: #f8f9fa;
      --card: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 32px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .brand img { width: 40px; height: 40px; border-radius: 8px; object-fit: contain; }
    .brand span { font-size: 18px; font-weight: 600; }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
    }
    .icon.pending {
      border: 4px solid rgba(0, 0, 0, 0.08);
      border-top-color: var(--brand);
      animation: spin 0.9s linear infinite;
    }
    .icon.succeeded { background: var(--ok); }
    .icon.failed    { background: var(--ko); }
    .icon.waiting   { background: #b7791f; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .icon.pending { animation-duration: 3s; } }

    h1 { font-size: 22px; line-height: 1.3; margin-bottom: 8px; }
    .message { font-size: 15px; line-height: 1.5; color: var(--muted); margin-bottom: 24px; }

    .summary {
      text-align: left;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 24px;
    }
    .summary div { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14px; }
    .summary dt { color: var(--muted); }
    .summary dd { font-weight: 600; text-align: right; overflow-wrap: anywhere; }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.92; }
    .btn:focus-visible { outline: 3px solid rgba(0, 112, 243, 0.4); outline-offset: 2px; }

    .note { font-size: 13px; color: var(--muted); margin-top: 12px; }

    .secure-footer { font-size: 11px; color: #aaa; margin-top: 24px; }
  </style>
</head>
<body>
  <main class="card">
    <header class="brand">
      <img id="brand-logo" src="/Logo_Monetiser.png" alt="" hidden>
      <span id="brand-name">Pago seguro</span>
    </header>

    <div id="icon" class="icon pending" aria-hidden="true"></div>

    <div role="status" aria-live="polite">
      <h1 id="title">Confirmando tu pago…</h1>
      <p id="message" class="message">No cierres esta ventana. Solo tardará unos segundos.</p>
    </div>

    <dl id="summary" class="summary" hidden>
      <div><dt>Importe</dt><dd id="amount"></dd></div>
      <div id="reference-row" hidden><dt>Referencia</dt><dd id="reference"></dd></div>
    </dl>

    <button id="return-btn" class="btn" type="button" hidden>Volver a la tienda</button>
    <p id="redirect-note" class="note" hidden></p>

    <footer class="secure-footer">🔒 Pago seguro · Monetiser</footer>
  </main>

  <script src="/checkout-result.js" defer></script>
</body>
</html>
