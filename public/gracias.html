<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gracias por tu pago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background-color: #f4f7fa;
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }

    .thankyou-container {
      background-color: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }

    .thankyou-container h1 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #2e7d32;
    }

    .thankyou-container p {
      font-size: 16px;
      margin-bottom: 20px;
    }

    .thankyou-container button {
      background-color: #2e7d32;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .thankyou-container button:hover {
      background-color: #1b5e20;
    }
  </style>
</head>
<body>
  <div class="thankyou-container">
    <h1>✅ ¡Pago recibido con éxito!</h1>
    <p>Gracias por tu compra. Hemos procesado tu pago correctamente.</p>
    <button onclick="window.location.href='https://retailandpayments.com'">Volver a la tienda</button>
  </div>
</body>
</html>
