<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Método de pago</title>
  <script src="https://applepay.cdn-apple.com/jsapi/v1/apple-pay-sdk.js"></script>
  <script async src="https://pay.google.com/gp/p/js/pay.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f9f9f9;
      padding: 1rem;
    }

    .payment-method {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      cursor: pointer;
      background-color: white;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    .payment-method.active {
      border-color: #0066cc;
      box-shadow: 0 0 6px rgba(0, 102, 204, 0.3);
    }

    .payment-method h3 {
      margin: 0;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .payment-form {
      display: none;
      margin-top: 1rem;
      border-top: 1px solid #eee;
      padding-top: 1rem;
    }

    .payment-form.active {
      display: block;
    }

    label {
      display: block;
      margin-top: 0.5rem;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 0.4rem;
      margin-top: 0.2rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      margin-top: 1rem;
      padding: 0.6rem;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    h2 {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <h2>Método de pago</h2>

  <div id="methods">
    <div class="payment-method" onclick="selectMethod('card')" id="method-card">
      <h3>Pago con tarjeta <span>💳</span></h3>
    </div>
    <div class="payment-method" onclick="selectMethod('applepay')" id="method-applepay">
      <h3>Apple Pay <span>🍎</span></h3>
    </div>
    <div class="payment-method" onclick="selectMethod('googlepay')" id="method-googlepay">
      <h3>Google Pay <span>🅖</span></h3>
    </div>
  </div>

  <!-- FORMULARIO TARJETA -->
  <form id="card-form" class="payment-form">
    <label for="cardholderName">Cardholder Name</label>
    <input type="text" id="cardholderName" required />

    <label for="cardNumber">Card Number</label>
    <input type="text" id="cardNumber" maxlength="19" required />

    <label for="expiryMonth">Expiry Month (MM)</label>
    <input type="text" id="expiryMonth" maxlength="2" required />

    <label for="expiryYear">Expiry Year (YYYY)</label>
    <input type="text" id="expiryYear" maxlength="4" required />

    <label for="cvv">CVV</label>
    <input type="text" id="cvv" maxlength="4" required />

    <label for="amount">Amount</label>
    <input type="number" id="amount" step="0.01" required />

    <label for="currency">Currency</label>
    <select id="currency" required>
      <option value="">-- Select --</option>
      <option value="EUR">EUR</option>
      <option value="USD">USD</option>
      <option value="BRL">BRL</option>
    </select>

    <button type="submit">Pagar</button>
  </form>

  <!-- FORMULARIO APPLE PAY -->
  <div id="applepay-form" class="payment-form">
    <p>Usa Apple Pay para completar tu compra:</p>
    <div id="apple-pay-button"></div>
  </div>

  <!-- FORMULARIO GOOGLE PAY -->
  <div id="googlepay-form" class="payment-form">
    <p>Usa Google Pay para completar tu compra:</p>
    <div id="google-pay-button"></div>
  </div>

  <script src="inpage.js"></script>
</body>
</html>
