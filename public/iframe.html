<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iFrame de Pago Seguro</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .payment-container {
      background: white;
      padding: 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      position: relative;
    }

    .powered-by {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      font-size: 12px;
      color: #999;
    }

    .powered-by img {
      height: 16px;
      margin-left: 6px;
    }

    h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }

    .payment-method {
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      margin-bottom: 16px;
      padding: 12px;
      transition: box-shadow 0.3s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .payment-method:hover {
      box-shadow: 0 0 0 2px #0070f3;
      transform: scale(1.01);
    }

    .payment-method h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
    }

    .payment-form {
      display: none;
      margin-top: 12px;
      animation: fadeIn 0.3s ease-in-out;
    }

    .payment-form.show {
      display: block;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 4px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0, 112, 243, 0.2);
    }

    button[type="submit"] {
      background-color: #0070f3;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button[type="submit"]:hover {
      background-color: #005ac1;
    }

    .wallet-button-container {
      text-align: center;
    }

    .wallet-button {
      width: 100%;
      margin: 8px 0;
    }

    .wallet-button img {
      width: 100%;
      border-radius: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .wallet-button img:hover {
      transform: scale(1.01);
      box-shadow: 0 0 0 2px #0070f3;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .payment-container {
        padding: 16px;
      }

      h2 {
        font-size: 18px;
      }

      label {
        font-size: 13px;
      }

      input, button[type="submit"] {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="payment-container">
    <div class="powered-by">
      Powered by
      <img src="/Logo_Monetiser.png" alt="Monetiser Logo">
    </div>
    <h2>Selecciona tu método de pago</h2>

    <div class="payment-method" id="method-card">
      <h3>Pago con tarjeta</h3>
      <form id="card-payment-form" class="payment-form">
        <div class="form-group">
          <label for="cardholderName">Titular</label>
          <input type="text" id="cardholderName" required />
        </div>
        <div class="form-group">
          <label for="cardNumber">Número de tarjeta</label>
          <input type="text" id="cardNumber" required />
        </div>
        <div class="form-group">
          <label for="expiryMonth">Mes de expiración</label>
          <input type="text" id="expiryMonth" required />
        </div>
        <div class="form-group">
          <label for="expiryYear">Año de expiración</label>
          <input type="text" id="expiryYear" required />
        </div>
        <div class="form-group">
          <label for="cvv">CVV</label>
          <input type="text" id="cvv" required />
        </div>
        <div class="form-group">
          <label for="amount">Importe</label>
          <input type="number" step="0.01" id="amount" required />
        </div>
        <div class="form-group">
          <label for="currency">Divisa</label>
          <input type="text" id="currency" value="EUR" required />
        </div>
        <button type="submit">Pagar</button>
      </form>
    </div>

    <div class="payment-method" id="method-applepay">
      <div class="wallet-button-container">
        <div class="wallet-button">
          <img src="/applepay-custom.png" alt="Apple Pay" onclick="startApplePaySession()" />
        </div>
      </div>
    </div>

    <div class="payment-method" id="method-googlepay">
      <div class="wallet-button-container">
        <div class="wallet-button">
          <img src="/googlepay-custom.png" alt="Google Pay" onclick="onGooglePayButtonClicked()" />
        </div>
      </div>
    </div>
  </div>
  <script src="/inpage.js"></script>
</body>
</html>
