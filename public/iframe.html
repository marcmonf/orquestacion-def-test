<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>iFrame de Pago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .payment-container {
      max-width: 420px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      position: relative;
      transition: all 0.3s ease;
    }

    .powered-by {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 10px;
      color: #999;
      display: flex;
      align-items: center;
    }

    .powered-by img {
      height: 20px;
      margin-left: 5px;
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    .method-header {
      background-color: #eee;
      padding: 12px;
      margin-bottom: 5px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease-in-out;
    }

    .method-header:hover {
      background-color: #e0e0e0;
      transform: scale(1.01);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .method-header.active {
      background-color: #ddd;
    }

    .method-form {
      display: none;
      animation: fadeSlide 0.3s ease-out;
    }

    .method-form.show {
      display: block;
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    label {
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: #0070f3;
      box-shadow: 0 0 0 2px rgba(0, 112, 243, 0.2);
    }

    button {
      margin-top: 15px;
      padding: 12px;
      background-color: #2b6cb0;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #234e94;
      transform: scale(1.01);
    }

    .wallet-button {
      width: 100%;
      margin: 16px 0;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .wallet-button img {
      width: 100%;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .wallet-button img:hover {
      transform: scale(1.02);
      box-shadow: 0 0 0 2px rgba(0, 112, 243, 0.15);
    }
  </style>
</head>
<body>
  <div class="payment-container">
    <div class="powered-by">
      Powered by
      <img src="/Logo_Monetiser.png" alt="Monetiser Logo">
    </div>

    <h2>Método de Pago</h2>

    <div id="method-card" class="method-header">Pago con tarjeta</div>
    <div id="card-form" class="method-form">
      <form id="card-payment-form">
        <label for="cardholderName">Nombre en la tarjeta</label>
        <input type="text" id="cardholderName" required>

        <label for="cardNumber">Número de tarjeta</label>
        <input type="text" id="cardNumber" required>

        <label for="expiryMonth">Mes de expiración (MM)</label>
        <input type="text" id="expiryMonth" required>

        <label for="expiryYear">Año de expiración (YY)</label>
        <input type="text" id="expiryYear" required>

        <label for="cvv">CVV</label>
        <input type="text" id="cvv" required>

        <label for="amount">Importe</label>
        <input type="number" step="0.01" id="amount" required>

        <label for="currency">Moneda</label>
        <input type="text" id="currency" value="EUR" required>

        <button type="submit">Pagar</button>
      </form>
    </div>

    <div class="wallet-button">
      <img src="/applepay-custom.png" alt="Apple Pay" onclick="startApplePaySession()" />
    </div>

    <div class="wallet-button">
      <img src="/googlepay-custom.png" alt="Google Pay" onclick="onGooglePayButtonClicked()" />
    </div>
  </div>

  <script src="https://pay.google.com/gp/p/js/pay.js" async></script>
  <script src="/inpage.js"></script>
</body>
</html>
