<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Payment</title>
  <script src="https://applepay.cdn-apple.com/jsapi/v1/apple-pay-sdk.js"></script>
  <script async src="https://pay.google.com/gp/p/js/pay.js"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
      background-color: #f9f9f9;
    }
    label {
      display: block;
      margin-top: 0.5rem;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 0.4rem;
      margin-top: 0.2rem;
      margin-bottom: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 0.5rem;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .payment-form {
      display: none;
    }
  </style>
</head>
<body>
  <h2>Select Payment Method</h2>
  <select id="paymentMethod">
    <option value="card">Card</option>
    <option value="applepay">Apple Pay</option>
    <option value="googlepay">Google Pay</option>
  </select>

  <!-- FORMULARIO TARJETA -->
  <form id="card-form" class="payment-form">
    <label for="cardholderName">Cardholder Name</label>
    <input type="text" id="cardholderName" required />

    <label for="cardNumber">Card Number</label>
    <input type="text" id="cardNumber" inputmode="numeric" maxlength="19" required />

    <label for="expiryMonth">Expiry Month (MM)</label>
    <input type="text" id="expiryMonth" maxlength="2" required />

    <label for="expiryYear">Expiry Year (YYYY)</label>
    <input type="text" id="expiryYear" maxlength="4" required />

    <label for="cvv">CVV</label>
    <input type="text" id="cvv" maxlength="4" required />

    <label for="amount">Amount</label>
    <input type="number" id="amount" step="0.01" required />

    <label for="currency">Currency</label>
    <select id="currency" required>
      <option value="">-- Select --</option>
      <option value="EUR">EUR</option>
      <option value="USD">USD</option>
      <option value="BRL">BRL</option>
    </select>

    <button type="submit">Pay Securely</button>
  </form>

  <!-- FORMULARIO APPLE PAY -->
  <div id="applepay-form" class="payment-form">
    <p>Use Apple Pay to complete your purchase:</p>
    <div id="apple-pay-button"></div>
  </div>

  <!-- FORMULARIO GOOGLE PAY -->
  <div id="googlepay-form" class="payment-form">
    <p>Use Google Pay to complete your purchase:</p>
    <div id="google-pay-button"></div>
  </div>

  <script src="inpage.js"></script>
</body>
</html>
