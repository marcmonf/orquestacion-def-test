<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Card Entry</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
      background-color: #f9f9f9;
    }
    label {
      display: block;
      margin-top: 0.5rem;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 0.4rem;
      margin-top: 0.2rem;
      margin-bottom: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 0.5rem;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form id="card-form">
    <label for="cardholderName">Cardholder Name</label>
    <input type="text" id="cardholderName" required />

    <label for="cardNumber">Card Number</label>
    <input type="text" id="cardNumber" inputmode="numeric" maxlength="19" required />

    <label for="expiryMonth">Expiry Month (MM)</label>
    <input type="text" id="expiryMonth" maxlength="2" required />

    <label for="expiryYear">Expiry Year (YYYY)</label>
    <input type="text" id="expiryYear" maxlength="4" required />

    <label for="cvv">CVV</label>
    <input type="text" id="cvv" maxlength="4" required />

    <label for="amount">Amount</label>
    <input type="number" id="amount" step="0.01" required />

    <label for="currency">Currency</label>
    <select id="currency" required>
      <option value="">-- Select --</option>
      <option value="EUR">EUR</option>
      <option value="USD">USD</option>
      <option value="BRL">BRL</option>
    </select>

    <button type="submit">Pay Securely</button>
  </form>

  <script>
    const apiUrl = '/iframe';

    document.getElementById('card-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const data = {
        cardholderName: document.getElementById('cardholderName').value,
        cardNumber: document.getElementById('cardNumber').value,
        expiryMonth: document.getElementById('expiryMonth').value,
        expiryYear: document.getElementById('expiryYear').value,
        cvv: document.getElementById('cvv').value,
        amount: parseFloat(document.getElementById('amount').value),
        currency: document.getElementById('currency').value
      };

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();

        if (result.success && result.transaction) {
          alert('✅ Payment Successful!\nTransaction ID: ' + result.transaction._id);
          window.parent.postMessage({ status: 'success', data: result.transaction }, '*');
        } else {
          alert(result.message || 'Payment failed.');
          window.parent.postMessage({ status: 'error', message: result.message }, '*');
        }
      } catch (err) {
        console.error('Error submitting form:', err);
        alert('Payment failed due to technical error.');
      }
    });
  </script>
</body>
</html>
