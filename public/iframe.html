<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>iFrame de Pago</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>:root{--brand-color:__BRAND_COLOR__;--accent-color:__ACCENT_COLOR__}</style>
  <style>
    body{font-family:'Inter',sans-serif;background-color:#f5f5f5;margin:0;padding:20px}
    .payment-container{max-width:420px;margin:0 auto;background:#fff;padding:25px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.08);position:relative;transition:.3s}
    .powered-by{position:absolute;top:10px;right:15px;font-size:10px;color:#999;display:flex;align-items:center}
    .powered-by img{height:48px;margin-left:4px}
    h2{text-align:center;color:var(--brand-color)}
    .method-header{background:#eee;padding:12px;margin-bottom:5px;border-radius:10px;cursor:pointer;font-weight:bold;transition:.2s}
    .method-header:hover{background:#e0e0e0;transform:scale(1.01)}
    .method-header.active{background:#ddd}
    .method-form{display:none;animation:fadeSlide .3s}
    .method-form.show{display:block}
    @keyframes fadeSlide{0%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}
    label{display:block;margin-top:10px;font-size:14px}
    input{width:100%;padding:10px;margin-top:5px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box;transition:border .2s,box-shadow .2s}
    input:focus{outline:none;border-color:var(--brand-color);box-shadow:0 0 0 2px rgba(0,112,243,.2)}
    button{margin-top:15px;padding:12px;background:var(--brand-color);color:#fff;border:none;border-radius:10px;cursor:pointer;width:100%;font-weight:bold;transition:.2s}
    button:hover{background:var(--accent-color);transform:scale(1.01)}
    .wallet-button{width:100%;margin:16px 0}
    .wallet-button img{width:100%;border-radius:12px;cursor:pointer;transition:.2s}
    .wallet-button img:hover{transform:scale(1.02);box-shadow:0 0 0 2px rgba(0,112,243,.15)}
    #success-message{display:none;background:#e6ffed;color:#256029;padding:15px;border:1px solid #b7eb8f;border-radius:12px;margin-bottom:20px;animation:fadeSlide .3s}
    #success-message strong{display:block;margin-bottom:6px;font-size:16px}
    #success-message button{margin-top:12px;padding:10px 16px;background:var(--brand-color)}
  </style>
</head>
<body>
  <div class="payment-container">
    <div class="powered-by">
      <img id="merchantLogo" src="__LOGO_SRC__" alt="Logo"/>
    </div>

    <div id="success-message"></div>

    <h2>Método de Pago</h2>

    <div id="method-card" class="method-header">Pago con tarjeta</div>
    <div id="card-form" class="method-form">
      <form id="card-payment-form">
        <label for="cardholderName">Nombre en la tarjeta</label>
        <input type="text" id="cardholderName" required>
        <label for="cardNumber">Número de tarjeta</label>
        <input type="text" id="cardNumber" required>
        <label for="expiryMonth">Mes de expiración (MM)</label>
        <input type="text" id="expiryMonth" required>
        <label for="expiryYear">Año de expiración (YY)</label>
        <input type="text" id="expiryYear" required>
        <label for="cvv">CVV</label>
        <input type="text" id="cvv" required>
        <label for="amount">Importe</label>
        <input type="number" step="0.01" id="amount" required value="__AMOUNT__">
        <label for="currency">Moneda</label>
        <input type="text" id="currency" value="__CURRENCY__" required>
        <button type="submit">Pagar</button>
      </form>
    </div>

    <div class="wallet-button">
      <img src="/applepay-custom.png" alt="Apple Pay" onclick="startApplePaySession()"/>
    </div>
    <div class="wallet-button">
      <img src="/googlepay-custom.png" alt="Google Pay" onclick="onGooglePayButtonClicked()"/>
    </div>
  </div>

  <!-- Contexto inyectado desde backend para el iframe -->
  <script>
    window.MONETISER_CONTEXT = {
      merchantId: "__MERCHANT_ID__",
      paymentId: "__PAYMENT_ID__",
      amount: "__AMOUNT__",
      currency: "__CURRENCY__"
    };
  </script>

  <script src="https://pay.google.com/gp/p/js/pay.js" async></script>
  <script src="/inpage.js"></script>
</body>
</html>
