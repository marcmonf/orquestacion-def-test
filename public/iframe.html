<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Secure Payment iFrame</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 1rem;
      background-color: #f9f9f9;
    }
    label {
      display: block;
      margin-top: 0.5rem;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 0.4rem;
      margin-top: 0.2rem;
      margin-bottom: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 0.5rem;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form id="card-form">
    <label for="cardholderName">Cardholder Name</label>
    <input type="text" id="cardholderName" required />

    <label for="cardNumber">Card Number</label>
    <input type="text" id="cardNumber" inputmode="numeric" maxlength="19" required />

    <label for="expiryMonth">Expiry Month (MM)</label>
    <input type="text" id="expiryMonth" maxlength="2" required />

    <label for="expiryYear">Expiry Year (YYYY)</label>
    <input type="text" id="expiryYear" maxlength="4" required />

    <label for="cvv">CVV</label>
    <input type="text" id="cvv" maxlength="4" required />

    <button type="submit">Pay</button>
  </form>

  <script>
    const queryParams = new URLSearchParams(window.location.search);
    const amount = queryParams.get('amount');
    const currency = queryParams.get('currency');
    const merchantId = queryParams.get('merchantId');
    const lang = queryParams.get('lang') || 'en';

    const messages = {
      en: {
        tokenFailed: 'Tokenization failed.',
        transactionFailed: 'Transaction failed.',
        transactionSuccess: 'Payment successful!'
      },
      es: {
        tokenFailed: 'Falló la tokenización.',
        transactionFailed: 'La transacción ha fallado.',
        transactionSuccess: '¡Pago realizado con éxito!'
      },
      fr: {
        tokenFailed: 'Échec de la tokenisation.',
        transactionFailed: 'Échec de la transaction.',
        transactionSuccess: 'Paiement réussi !'
      },
      pt: {
        tokenFailed: 'Tokenização falhou.',
        transactionFailed: 'Falha na transação.',
        transactionSuccess: 'Pagamento realizado com sucesso!'
      }
    };

    const apiKey = 'your-api-key-here'; // ⛔ Sustituye por la API Key real

    document.getElementById('card-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const cardData = {
        cardholderName: document.getElementById('cardholderName').value,
        cardNumber: document.getElementById('cardNumber').value,
        expiryMonth: document.getElementById('expiryMonth').value,
        expiryYear: document.getElementById('expiryYear').value,
        cvv: document.getElementById('cvv').value
      };

      try {
        const tokenRes = await fetch('https://orquestacion-def-test.onrender.com/tokens', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'accept-language': lang
          },
          body: JSON.stringify(cardData)
        });

        const tokenResult = await tokenRes.json();

        if (!tokenResult.success || !tokenResult.token) {
          alert(messages[lang]?.tokenFailed || messages.en.tokenFailed);
          return;
        }

        const txPayload = {
          amount: parseFloat(amount),
          currency: currency,
          merchantId: merchantId,
          method: 'card',
          status: 'approved', // Simulado, real sería gestionado en backend
          cardholderName: cardData.cardholderName,
          expiryMonth: cardData.expiryMonth,
          expiryYear: cardData.expiryYear,
          token: tokenResult.token,
          transactionType: 'CIT'
        };

        const txRes = await fetch('https://orquestacion-def-test.onrender.com/transactions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'accept-language': lang
          },
          body: JSON.stringify(txPayload)
        });

        const txResult = await txRes.json();

        if (txResult.success) {
          alert(messages[lang]?.transactionSuccess || messages.en.transactionSuccess);
        } else {
          alert(messages[lang]?.transactionFailed || messages.en.transactionFailed);
        }
      } catch (err) {
        console.error(err);
        alert(messages[lang]?.transactionFailed || messages.en.transactionFailed);
      }
    });
  </script>
</body>
</html>
