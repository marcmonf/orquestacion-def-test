<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monetiser Checkout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkout-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: contain;
      display: none;
    }

    .brand-logo.visible { display: block; }

    .brand-name {
      font-size: 18px;
      font-weight: 600;
      color: #111;
    }

    .amount-display {
      text-align: center;
      margin-bottom: 28px;
    }

    .amount-display .label {
      font-size: 13px;
      color: #888;
      margin-bottom: 4px;
    }

    .amount-display .value {
      font-size: 32px;
      font-weight: 700;
      color: #111;
    }

    .amount-display .currency {
      font-size: 16px;
      color: #555;
      margin-left: 4px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #444;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="tel"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      color: #111;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus { border-color: var(--brand-color, #5046e4); }

    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }

    /* Contenedor del sub-iFrame de Paylands (Proxy PCI) — PAN y CVV */
    #pan-container,
    #cvv-container {
      width: 100%;
      padding: 0 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      height: 44px;
      overflow: hidden;
      display: flex;
      align-items: center;
      transition: border-color 0.2s;
    }

    #pan-container.ready,
    #cvv-container.ready { border-color: #ddd; }

    #pan-container.error,
    #cvv-container.error { border-color: #e53e3e; }

    /* El iFrame interno de Paylands llena el contenedor */
    #pan-container iframe,
    #cvv-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .pci-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #888;
      margin-top: 6px;
    }

    .pci-badge::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #38a169;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--brand-color, #5046e4);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .submit-btn:hover { opacity: 0.92; }
    .submit-btn:active { transform: scale(0.99); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-message {
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 14px;
      display: none;
    }

    .status-message.success {
      background: #f0fff4;
      color: #276749;
      border: 1px solid #9ae6b4;
      display: block;
    }

    .status-message.error {
      background: #fff5f5;
      color: #c53030;
      border: 1px solid #feb2b2;
      display: block;
    }

    .status-message.loading {
      background: #f7fafc;
      color: #555;
      border: 1px solid #e2e8f0;
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .method-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .method-selector[hidden] { display: none; }
    .method-btn {
      flex: 1;
      min-width: 90px;
      padding: 10px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      background: white;
      font-size: 14px;
      cursor: pointer;
    }
    .method-btn[aria-pressed="true"] {
      border-color: var(--brand-color, #5046e4);
      color: var(--brand-color, #5046e4);
      font-weight: 600;
    }
    .secure-footer {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="checkout-card">
    <div class="brand-header">
      <img id="brand-logo" class="brand-logo" src="" alt="">
      <span id="brand-name" class="brand-name">Pago seguro</span>
    </div>

    <div class="amount-display">
      <div class="label">Total a pagar</div>
      <div>
        <span id="amount-value" class="value">—</span>
        <span id="amount-currency" class="currency"></span>
      </div>
    </div>

    <!-- Selección de método de pago (solo si hay más de uno) -->
    <div id="method-selector" class="method-selector" role="group" aria-label="Método de pago" hidden></div>

    <!-- Proveedor 'paylands_proxyfields': sub-iFrames de Paylands para PAN y CVV -->
    <div id="proxy-pci-form">
      <div class="form-group">
        <label>Número de tarjeta</label>
        <div id="pan-container"></div>
        <div class="pci-badge">Cifrado y protegido por PCI DSS</div>
      </div>
      <div class="row">
        <div class="form-group">
          <label for="expiry-month">Mes</label>
          <input type="tel" id="expiry-month" placeholder="MM" maxlength="2" autocomplete="cc-exp-month">
        </div>
        <div class="form-group">
          <label for="expiry-year">Año</label>
          <input type="tel" id="expiry-year" placeholder="AA" maxlength="2" autocomplete="cc-exp-year">
        </div>
        <div class="form-group">
          <label>CVV</label>
          <div id="cvv-container"></div>
        </div>
      </div>
      <div class="form-group">
        <label for="card-holder">Titular</label>
        <input type="text" id="card-holder" placeholder="Nombre en la tarjeta" autocomplete="cc-name">
      </div>
    </div>

    <button class="submit-btn" id="pay-btn" disabled>Cargando...</button>

    <div id="status-msg" class="status-message"></div>

    <div class="secure-footer">🔒 Pago seguro · Monetiser</div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════
    // NÚCLEO DEL CHECKOUT (framework multi-PSP, nov 2026).
    //
    // Monetiser no pinta NUNCA un campo de tarjeta propio (PCI SAQ A). Este
    // núcleo pinta la marca, el importe y, si hay más de un método de pago, la
    // pantalla de selección; y delega los campos en el PROVEEDOR DE CAMPOS del
    // PSP al que se enrutó el pago (módulo /checkout/providers/<id>.js, ruta
    // ABSOLUTA: este iFrame se sirve en /:merchantId/iframe sin barra final).
    // Hoy el único proveedor es 'paylands_proxyfields' (ProxyFields de Paylands).
    // ═══════════════════════════════════════════════════════════════════════
    const RUNTIME = window.__MONETISER_RUNTIME__ || {};
    const amount     = RUNTIME.amount     || '';
    const currency   = RUNTIME.currency   || '';
    const branding   = RUNTIME.branding   || {};
    const FIELDS_PROVIDER = RUNTIME.fieldsProvider || 'paylands_proxyfields';
    const PROVIDER_SCRIPT = RUNTIME.providerScript || '/checkout/providers/paylands_proxyfields.js';
    const METHODS = Array.isArray(RUNTIME.paymentMethods) && RUNTIME.paymentMethods.length ? RUNTIME.paymentMethods : ['card'];
    const METHOD_LABELS = { card: 'Tarjeta', bizum: 'Bizum', apple_pay: 'Apple Pay', google_pay: 'Google Pay', paypal: 'PayPal' };

    // Aplicar branding
    if (branding.brandColor) {
      document.documentElement.style.setProperty('--brand-color', branding.brandColor);
    }
    if (branding.logoUrl) {
      const logo = document.getElementById('brand-logo');
      logo.src = branding.logoUrl;
      logo.classList.add('visible');
    }
    if (branding.merchantName) {
      document.getElementById('brand-name').textContent = branding.merchantName;
    }

    document.getElementById('amount-value').textContent    = amount;
    document.getElementById('amount-currency').textContent = currency;

    const payBtn    = document.getElementById('pay-btn');
    const statusMsg = document.getElementById('status-msg');

    function showStatus(type, msg) {
      statusMsg.className = `status-message ${type}`;
      statusMsg.textContent = msg;
    }

    function setLoading(loading) {
      payBtn.disabled  = loading;
      payBtn.innerHTML = loading
        ? '<span class="spinner"></span>Procesando...'
        : 'Pagar ahora';
    }

    // ── Selección de método de pago ─────────────────────────────────────────
    // Con un solo método (hoy: tarjeta) no se enseña nada: el checkout es el de
    // siempre. Con varios, botones; el elegido muestra su bloque de campos.
    let activeMethod = METHODS[0];
    const selector = document.getElementById('method-selector');
    function selectMethod(m) {
      activeMethod = m;
      selector.querySelectorAll('button').forEach((b) => {
        b.setAttribute('aria-pressed', b.dataset.method === m ? 'true' : 'false');
      });
      document.getElementById('proxy-pci-form').style.display = m === 'card' ? 'block' : 'none';
      statusMsg.className = 'status-message';
    }
    if (METHODS.length > 1) {
      METHODS.forEach((m) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'method-btn';
        b.dataset.method = m;
        b.textContent = METHOD_LABELS[m] || m;
        b.addEventListener('click', () => selectMethod(m));
        selector.appendChild(b);
      });
      selector.hidden = false;
    }

    // Métodos sin flujo propio todavía (solo se ofrecerían con un flag de F5):
    // nunca se cobra nada; se avisa.
    payBtn.addEventListener('click', function() {
      if (activeMethod !== 'card') showStatus('error', 'Este método de pago aún no está disponible.');
    });

    const core = {
      runtime: RUNTIME,
      payBtn, statusMsg, showStatus, setLoading,
      isActive: (m) => activeMethod === m,
      navigate: (url) => { window.location.href = url; },
    };

    // ── Carga del proveedor de campos ───────────────────────────────────────
    function startProvider() {
      const providers = window.MonetiserCheckoutProviders || {};
      const provider = providers[FIELDS_PROVIDER];
      if (!provider) {
        showStatus('error', 'Método de pago no disponible. Recarga la página.');
        return;
      }
      selectMethod(activeMethod);
      provider.mount(core);
    }
    if (!/^\/checkout\/providers\/[a-z0-9_]+\.js$/.test(PROVIDER_SCRIPT)) {
      showStatus('error', 'Método de pago no disponible. Recarga la página.');
    } else {
      const ps = document.createElement('script');
      ps.src = PROVIDER_SCRIPT;
      ps.onload = startProvider;
      ps.onerror = function() {
        showStatus('error', 'Error al cargar el módulo de seguridad. Recarga la página.');
      };
      document.head.appendChild(ps);
    }
  </script>
</body>
</html>
