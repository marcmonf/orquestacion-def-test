<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>403 — Acceso no autorizado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      /* Colores alineados con el iFrame */
      --brand: #2b6cb0;  /* __BRAND_COLOR__ si lo llegamos a inyectar */
      --accent: #e67e22; /* __ACCENT_COLOR__ si lo llegamos a inyectar */
      --bg: #0b1324;
      --card: #121a2b;
      --text: #e6edf3;
      --muted: #9fb3c8;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid #1e2a41;
      border-radius: 16px;
      width: 100%;
      max-width: 560px;
      padding: 28px 24px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
      text-align: center;
    }
    .logo {
      display: inline-block;
      width: 120px; /* ~120px como pediste */
      height: auto;
      margin: 4px auto 16px;
    }
    .eyebrow {
      color: var(--accent);
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
      font-size: 12px;
    }
    h1 {
      margin: 10px 0 6px;
      font-size: 24px;
      line-height: 1.2;
    }
    p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .actions { margin-top: 18px; }
    .btn {
      display: inline-block;
      text-decoration: none;
      background: var(--brand);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <img class="logo" src="/Logo_Monetiser.png" alt="Monetiser" />
    <div class="eyebrow">Error 403</div>
    <h1 id="title">Acceso no autorizado</h1>
    <p>No tienes permiso para acceder a este recurso o la firma del enlace no es válida.</p>
    <div class="actions">
      <a class="btn" href="#" onclick="location.reload()">Reintentar</a>
    </div>
  </main>
</body>
</html>
