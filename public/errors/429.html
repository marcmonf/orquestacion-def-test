<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Demasiadas solicitudes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --brand: #2b6cb0;
      --accent: #e67e22;
      --bg: #0b1324;
      --card: #121a2b;
      --text: #e6edf3;
      --muted: #9fb3c8;
    }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans";
      display: grid; place-items: center; min-height: 100vh; padding: 24px;
    }
    .card {
      background: var(--card); border: 1px solid #1e2a41; border-radius: 16px;
      max-width: 560px; width: 100%; padding: 28px 24px; box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    }
    .eyebrow { color: var(--accent); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; }
    h1 { margin: 8px 0 6px; font-size: 24px; }
    p { margin: 8px 0 0; color: var(--muted); line-height: 1.6; }
    .hint { margin-top: 16px; font-size: 14px; color: var(--muted); }
    .actions { margin-top: 18px; display: flex; gap: 12px; flex-wrap: wrap; }
    a.btn {
      text-decoration: none; background: var(--brand); color: white; padding: 10px 14px; border-radius: 10px;
      display: inline-block; font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-labelledby="title">
    <div class="eyebrow">Error 429</div>
    <h1 id="title">Demasiadas solicitudes</h1>
    <p>Has superado el número de intentos permitidos para cargar el iFrame. Espera unos segundos y vuelve a intentarlo.</p>
    <p class="hint">Este control nos ayuda a proteger tu pago y evitar abusos.</p>
    <div class="actions">
      <a class="btn" href="#" onclick="location.reload()">Reintentar</a>
    </div>
  </main>
</body>
</html>
