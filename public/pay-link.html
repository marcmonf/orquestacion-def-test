<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Pago · {{MERCHANT_NAME}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; color: #111; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 32px; width: 100%; max-width: 420px; }
    .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid #eee; }
    .brand img { width: 40px; height: 40px; border-radius: 8px; object-fit: contain; }
    .brand span { font-size: 18px; font-weight: 600; }
    .concept { font-size: 15px; color: #444; margin-bottom: 8px; text-align: center; word-wrap: break-word; }
    .amount { font-size: 32px; font-weight: 700; text-align: center; margin-bottom: 28px; }
    button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: {{BRAND_COLOR}}; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    .msg { text-align: center; padding: 14px; border-radius: 8px; background: #f7fafc; border: 1px solid #e2e8f0; color: #444; font-size: 14px; }
    [hidden] { display: none !important; }
    .foot { text-align: center; font-size: 11px; color: #999; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="{{LOGO_URL}}" alt=""><span>{{MERCHANT_NAME}}</span></div>
    <div class="concept">{{CONCEPT}}</div>
    <div class="amount">{{AMOUNT}}</div>
    <form method="post" action="{{ACTION}}" {{FORM_HIDDEN}}>
      <button type="submit">Pagar</button>
    </form>
    <div class="msg" {{MESSAGE_HIDDEN}}>{{MESSAGE}}</div>
    <div class="foot">🔒 Pago seguro · Monetiser. Los datos de tu tarjeta se introducen en la página segura del procesador de pagos.</div>
  </div>
</body>
</html>
